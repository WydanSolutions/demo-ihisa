/* =====================================================================
   REGLAS DEL NEGOCIO
   Todo lo que "calcula" la página está acá: horas, tarifas, totales del
   parte, control contra el reloj, costo y margen, y el avance de estados.
   La pantalla solo pregunta; no hace cuentas por su cuenta.
   ===================================================================== */

/* ---------- Tarifa del cliente, con fecha de vigencia ----------
   Cada cliente guarda su historial de tarifas. Si DANK sube la hora en agosto, los partes
   de julio NO se recalculan: cada fila guarda el precio que tenía ese día (fila.pu). */
function tarifaCliente(clienteId, fecha){
  const c = clienteDe(clienteId);
  const vacia = { comun: 0, extra: 0, descanso: 0, desde: '' };
  if (!c || !Array.isArray(c.tarifas) || !c.tarifas.length) return vacia;
  const f = String(fecha || hoy());
  const vigentes = c.tarifas.filter(t => String(t.desde) <= f).sort((a, b) => String(a.desde) < String(b.desde) ? 1 : -1);
  const t = vigentes[0] || c.tarifas.slice().sort((a, b) => String(a.desde) < String(b.desde) ? 1 : -1).pop();
  return { comun: t.comun || 0, extra: t.extra || 0, descanso: t.descanso || t.extra || 0, desde: t.desde };
}
/* Precio por hora según el tipo de hora */
function precioHora(clienteId, fecha, tipoHora){
  const t = tarifaCliente(clienteId, fecha);
  if (tipoHora === 'extra') return t.extra;
  if (tipoHora === 'descanso') return t.descanso;
  return t.comun;
}

/* ---------- Horas de una fila ----------
   Si hay entrada y salida, las horas se calculan solas (07:00 a 16:30 = 9,5 h).
   Si no, se usa lo que se cargó a mano (hay trabajos que se cargan directo en horas). */
function horasFila(fila){
  const calc = horasEntre(fila.entrada, fila.salida);
  return redondear(calc !== null ? calc : (Number(fila.horas) || 0));
}
/* El tipo de hora que corresponde por el día: en IHISA el lunes es día de descanso */
function tipoHoraPorFecha(fecha){
  return diaSemana(fecha) === cfg().diaDescanso ? 'descanso' : 'comun';
}
const esDiaDescanso = fecha => diaSemana(fecha) === cfg().diaDescanso;

/* Total de una fila: horas × precio − descuento */
function totalFila(fila){
  const h = horasFila(fila);
  const pu = Number(fila.pu) || 0;
  const desc = Number(fila.descuento) || 0;
  return redondear(Math.max(0, h * pu - desc));
}

/* ---------- Totales de un parte ---------- */
function totalesParte(parte){
  const filas = parte.filas || [];
  const horas = redondear(sumar(filas, horasFila));
  const subtotal = redondear(sumar(filas, totalFila));
  const iva = redondear(subtotal * cfg().iva / 100);
  const porTipo = {};
  TIPOS_HORA.forEach(t => porTipo[t.id] = redondear(sumar(filas.filter(f => (f.tipoHora || 'comun') === t.id), horasFila)));
  return { horas, subtotal, iva, total: redondear(subtotal + iva), porTipo, cantFilas: filas.length };
}
/* Totales de un montón de partes juntos */
function totalesDe(partes){
  const horas = redondear(sumar(partes, p => totalesParte(p).horas));
  const subtotal = redondear(sumar(partes, p => totalesParte(p).subtotal));
  const iva = redondear(subtotal * cfg().iva / 100);
  const porTipo = {};
  TIPOS_HORA.forEach(t => porTipo[t.id] = redondear(sumar(partes, p => totalesParte(p).porTipo[t.id])));
  return { horas, subtotal, iva, total: redondear(subtotal + iva), porTipo, cant: partes.length };
}

/* ---------- Buscar partes ---------- */
function partesEntre(desde, hasta, filtro){
  return Store.listar('partes', p => p.fecha >= desde && p.fecha <= hasta && (!filtro || filtro(p)))
    .sort((a, b) => a.fecha < b.fecha ? 1 : (a.fecha > b.fecha ? -1 : 0));
}
const partesDelDia = f => Store.listar('partes', p => p.fecha === f);
const partesDeSemana = f => partesEntre(inicioSemana(f), finSemana(f));
const partesDelMes = clave => partesEntre(clave + '-01', clave + '-31');

/* Todas las filas (funcionario + horas) de un período, ya "aplanadas" con el dato del parte.
   Es lo que usan el reporte al cliente, las horas por funcionario y los gráficos. */
function filasEntre(desde, hasta, filtro){
  const out = [];
  partesEntre(desde, hasta).forEach(p => {
    (p.filas || []).forEach(f => {
      const fila = { ...f, parte: p, fecha: p.fecha, clienteId: p.clienteId, contacto: p.contacto,
        area: p.area, tipoId: p.tipoId, actividad: p.actividad, ot: p.ot, estado: p.estado,
        horasCalc: horasFila(f), totalCalc: totalFila(f), tipoHora: f.tipoHora || 'comun' };
      if (!filtro || filtro(fila)) out.push(fila);
    });
  });
  return out.sort((a, b) => a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0));
}

/* ---------- Horas de un funcionario ---------- */
function horasFuncionario(funcId, desde, hasta){
  const filas = filasEntre(desde, hasta, f => f.funcId === funcId);
  const r = { comun: 0, extra: 0, descanso: 0, total: 0, dias: 0, facturado: 0, filas };
  const dias = new Set();
  filas.forEach(f => { r[f.tipoHora] = redondear(r[f.tipoHora] + f.horasCalc); r.total = redondear(r.total + f.horasCalc); r.facturado = redondear(r.facturado + f.totalCalc); dias.add(f.fecha); });
  r.dias = dias.size;
  return r;
}
/* Lo que marcó el reloj */
function marcasEntre(funcId, desde, hasta){
  return Store.listar('marcas', m => m.funcId === funcId && m.fecha >= desde && m.fecha <= hasta)
    .sort((a, b) => a.fecha < b.fecha ? -1 : 1);
}
function horasReloj(funcId, desde, hasta){
  const m = marcasEntre(funcId, desde, hasta);
  return { total: redondear(sumar(m, x => Number(x.horas) || 0)), extra: redondear(sumar(m, x => Number(x.extra) || 0)), dias: m.length };
}

/* ---------- Control de horas: reloj contra partes, día por día ----------
   La diferencia son horas que se pagan y no se le cobran a nadie (o al revés). */
function controlHoras(funcId, desde, hasta){
  const filas = filasEntre(desde, hasta, f => f.funcId === funcId);
  const marcas = marcasEntre(funcId, desde, hasta);
  const dias = {};
  const tocar = f => dias[f] = dias[f] || { fecha: f, imputadas: 0, marcadas: 0, entrada: '', salida: '', partes: [] };
  filas.forEach(f => { const d = tocar(f.fecha); d.imputadas = redondear(d.imputadas + f.horasCalc); d.partes.push(f.parte); });
  marcas.forEach(m => { const d = tocar(m.fecha); d.marcadas = redondear(d.marcadas + (Number(m.horas) || 0)); d.entrada = m.entrada || d.entrada; d.salida = m.salida || d.salida; });
  const lista = Object.values(dias).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  lista.forEach(d => {
    d.dif = redondear(d.marcadas - d.imputadas);
    d.ok = Math.abs(d.dif) <= cfg().toleranciaDif;
    d.soloReloj = d.marcadas > 0 && d.imputadas === 0;
    d.soloParte = d.imputadas > 0 && d.marcadas === 0;
  });
  const conDif = lista.filter(d => !d.ok);
  return {
    dias: lista, conDif,
    imputadas: redondear(sumar(lista, d => d.imputadas)),
    marcadas: redondear(sumar(lista, d => d.marcadas)),
    dif: redondear(sumar(lista, d => d.dif)),
    sinImputar: redondear(sumar(conDif.filter(d => d.dif > 0), d => d.dif)),
  };
}
/* Horas que el reloj marcó y no están en ningún trabajo, de toda la empresa, valuadas en pesos.
   Es el número más fuerte de la herramienta: plata que se pagó y no se facturó. */
function sinImputarDe(desde, hasta){
  let horas = 0, costo = 0, venta = 0, conDif = 0;
  funcActivos().forEach(f => {
    const c = controlHoras(f.id, desde, hasta);
    if (c.sinImputar > 0){
      horas = redondear(horas + c.sinImputar);
      costo = redondear(costo + c.sinImputar * (Number(f.valorHora) || 0));
      venta = redondear(venta + c.sinImputar * (tarifaCliente(clientePrincipal(), hasta).comun || 0));
    }
    conDif += c.conDif.length;
  });
  return { horas, costo, venta, conDif };
}
const clientePrincipal = () => { const c = Store.listar('clientes').sort((a, b) => (b.principal ? 1 : 0) - (a.principal ? 1 : 0)); return c[0] ? c[0].id : ''; };

/* ---------- Costo de mano de obra y margen ---------- */
function valorHoraFunc(func, tipoHora){
  const base = Number(func && func.valorHora) || 0;
  if (tipoHora === 'extra') return redondear(base * (1 + cfg().recargoExtraFunc / 100));
  if (tipoHora === 'descanso') return redondear(base * (1 + cfg().recargoDescansoFunc / 100));
  return base;
}
function costoYMargen(filas){
  let costo = 0, venta = 0, horas = 0;
  filas.forEach(f => {
    const fu = funcDe(f.funcId);
    costo = redondear(costo + f.horasCalc * valorHoraFunc(fu, f.tipoHora) * (1 + cfg().cargasSociales / 100));
    venta = redondear(venta + f.totalCalc);
    horas = redondear(horas + f.horasCalc);
  });
  const margen = redondear(venta - costo);
  return { costo, venta, horas, margen, pct: venta ? Math.round(margen / venta * 100) : 0,
    porHora: horas ? redondear(margen / horas) : 0 };
}

/* ---------- Adelantos ---------- */
const adelantosDe = (funcId, desde, hasta) => Store.listar('adelantos',
  a => a.funcId === funcId && (!desde || a.fecha >= desde) && (!hasta || a.fecha <= hasta));
const totalAdelantos = (funcId, desde, hasta) => redondear(sumar(adelantosDe(funcId, desde, hasta), a => Number(a.monto) || 0));

/* ---------- Cobros (lo que se le facturó al cliente) ---------- */
function estadoCobro(c){
  if (c.estado === 'cobrado') return 'cobrado';
  return (c.vence && c.vence < hoy()) ? 'vencido' : 'pendiente';
}
function cobrosDe(filtro){ return Store.listar('cobros', filtro).sort((a, b) => a.fecha < b.fecha ? 1 : -1); }
function saldoCliente(clienteId){
  return redondear(sumar(cobrosDe(c => c.clienteId === clienteId && estadoCobro(c) !== 'cobrado'), c => Number(c.total) || 0));
}
const porCobrar = () => redondear(sumar(cobrosDe(c => estadoCobro(c) !== 'cobrado'), c => Number(c.total) || 0));
const vencido = () => redondear(sumar(cobrosDe(c => estadoCobro(c) === 'vencido'), c => Number(c.total) || 0));

/* ---------- Avanzar el estado de un parte ---------- */
function proximoEstado(id){ const i = indiceEstado(id); return ESTADOS[Math.min(i + 1, ESTADOS.length - 1)].id; }
function avanzarParte(parteId){
  const p = Store.obtener('partes', parteId); if (!p) return null;
  const sig = proximoEstado(p.estado);
  if (sig === p.estado) return p;
  const cambios = { estado: sig };
  if (sig === 'reportado') cambios.reportadoEn = hoy();
  if (sig === 'facturado') cambios.facturadoEn = hoy();
  return Store.editar('partes', parteId, cambios, `Parte del ${fFecha(p.fecha)} pasó a «${estadoDe(sig).nombre}»`);
}
function cambiarEstadoParte(parteId, estado){
  const p = Store.obtener('partes', parteId); if (!p) return null;
  const cambios = { estado };
  if (estado === 'reportado' && !p.reportadoEn) cambios.reportadoEn = hoy();
  if (estado === 'facturado' && !p.facturadoEn) cambios.facturadoEn = hoy();
  return Store.editar('partes', parteId, cambios, `Parte del ${fFecha(p.fecha)}: ${estadoDe(estado).nombre}`);
}

/* ---------- Crear y copiar partes ---------- */
function nuevaFila(funcId, fecha, clienteId, tipoHora){
  const t = tipoHora || tipoHoraPorFecha(fecha);
  return { id: nuevoId('fil'), funcId, entrada: JORNADA.entrada, salida: JORNADA.salida,
    horas: '', tipoHora: t, pu: precioHora(clienteId, fecha, t), descuento: 0 };
}
function crearParte(datos){
  const p = {
    fecha: datos.fecha || hoy(), clienteId: datos.clienteId || '', contacto: datos.contacto || '',
    area: datos.area || '', tipoId: datos.tipoId || '', actividad: datos.actividad || '',
    ot: datos.ot || '', estado: datos.estado || 'curso', obs: datos.obs || '',
    filas: datos.filas || [],
  };
  return Store.crear('partes', p, `Nuevo parte del ${fFecha(p.fecha)}`);
}
/* Copia un parte a otra fecha: mismas personas y mismas horas, con la tarifa y el tipo
   de hora que correspondan a la fecha nueva (si cae en día de descanso, se marca solo). */
function copiarParte(parteId, fechaNueva){
  const p = Store.obtener('partes', parteId); if (!p) return null;
  const tipoDef = tipoHoraPorFecha(fechaNueva);
  const filas = (p.filas || []).map(f => {
    const th = (f.tipoHora === 'extra') ? 'extra' : tipoDef;
    return { ...f, id: nuevoId('fil'), tipoHora: th, pu: precioHora(p.clienteId, fechaNueva, th) };
  });
  return crearParte({ ...p, id: undefined, fecha: fechaNueva, estado: 'curso', filas,
    reportadoEn: undefined, facturadoEn: undefined });
}
/* El último día con partes cargados antes de una fecha (para "Repetir el parte anterior") */
function ultimoDiaConPartes(antesDe){
  const f = Store.listar('partes', p => p.fecha < antesDe).map(p => p.fecha).sort();
  return f.length ? f[f.length - 1] : null;
}

/* ---------- Avisos de la campanita ---------- */
function avisos(){
  const a = [];
  const mes = mesDe(hoy()), desdeMes = mes + '-01', hastaMes = mes + '-31';
  /* 1. Días con diferencia entre el reloj y los partes */
  const si = sinImputarDe(desdeMes, hastaMes);
  if (si.conDif) a.push({ tipo: 'critico', ico: 'reloj', t: `${si.conDif} día${si.conDif > 1 ? 's' : ''} con diferencia de horas`,
    s: si.horas ? `${fHoras(si.horas)} marcadas y sin imputar · ${pesos(si.venta)} sin facturar` : 'Revisá el control de horas', js: `irA('funcionarios','control')` });
  /* 2. Partes terminados sin reportar al cliente */
  const term = Store.listar('partes', p => p.estado === 'terminado');
  if (term.length) a.push({ tipo: 'alerta', ico: 'reportes', t: `${term.length} parte${term.length > 1 ? 's' : ''} terminado${term.length > 1 ? 's' : ''} sin reportar`,
    s: `${pesos(totalesDe(term).total)} listos para el reporte`, js: `irA('reportes')` });
  /* 3. Trabajos en curso de días pasados (quedaron abiertos) */
  const colgados = Store.listar('partes', p => p.estado === 'curso' && p.fecha < hoy());
  if (colgados.length) a.push({ tipo: 'alerta', ico: 'trabajos', t: `${colgados.length} parte${colgados.length > 1 ? 's' : ''} sin cerrar`,
    s: `El más viejo es del ${fFecha(colgados.map(p => p.fecha).sort()[0])}`, js: `irA('trabajos')` });
  /* 4. Cobros vencidos */
  const venc = cobrosDe(c => estadoCobro(c) === 'vencido');
  if (venc.length) a.push({ tipo: 'critico', ico: 'plata', t: `${venc.length} cobro${venc.length > 1 ? 's' : ''} vencido${venc.length > 1 ? 's' : ''}`,
    s: `${pesos(sumar(venc, c => c.total))} · el más viejo venció el ${fFecha(venc.map(c => c.vence).sort()[0])}`, js: `irA('cobros')` });
  /* 5. Cobros que vencen en los próximos 7 días */
  const porVencer = cobrosDe(c => estadoCobro(c) === 'pendiente' && diasEntre(hoy(), c.vence) <= 7);
  if (porVencer.length) a.push({ tipo: 'normal', ico: 'calendario', t: `${porVencer.length} cobro${porVencer.length > 1 ? 's' : ''} por vencer`,
    s: `${pesos(sumar(porVencer, c => c.total))} en los próximos 7 días`, js: `irA('cobros')` });
  /* 6. Adelantos del mes sin descontar */
  const ade = Store.listar('adelantos', x => mesDe(x.fecha) === mes && !x.descontado);
  if (ade.length) a.push({ tipo: 'normal', ico: 'plata', t: `${ade.length} adelanto${ade.length > 1 ? 's' : ''} este mes`,
    s: `${pesos(sumar(ade, x => x.monto))} para descontar`, js: `irA('funcionarios','adelantos')` });
  return a;
}

    F('fu_jon', 'Jonathan R.',    'Medio oficial', 'jornalero', 350, '07', '5.117.603-3', '092 718 445', COLORES_FUNC[6], 540),
    F('fu_dio', 'Diogo C.',       'Ayudante',      'jornalero', 290, '08', '5.448.017-9', '095 602 338', COLORES_FUNC[7], 210),
    F('fu_jos', 'José C.',        'Ayudante',      'jornalero', 285, '09', '5.330.884-5', '098 915 072', COLORES_FUNC[8], 160),
  ];
  const ids = { fre: 'fu_fre', wal: 'fu_wal', mar: 'fu_mar', cha: 'fu_cha', san: 'fu_san', mri: 'fu_mri', jon: 'fu_jon', dio: 'fu_dio', jos: 'fu_jos' };

  /* ---------------- Cuadrillas (para cargar un parte en tres toques) ---------------- */
  const cuadrillas = [
    { id: 'cu_ene', nombre: 'Cuadrilla Planta de Energía', clienteId: dank.id, contacto: 'Santiago P.',
      area: 'Planta de Energía', tipoId: 'tt_herr', funcIds: [ids.fre, ids.mri, ids.san, ids.mar] },

      area: 'Remanufactura', tipoId: 'tt_rota', funcIds: [ids.cha, ids.mri, ids.jon] },
  ];

  /* ---------------- Las actividades que hacen de verdad ---------------- */
  const ACT_ENERGIA = [
    { a: 'Tareas herrería Gas. 3', t: 'tt_herr' },
    { a: 'Base para turbina', t: 'tt_estr' },
    { a: 'Soldar cilindros', t: 'tt_sold' },
    { a: 'Quitar estructura embarcadero viejo', t: 'tt_desm' },
    { a: 'Revisión y ajuste de cintas transportadoras', t: 'tt_prev' },
  ];
  const ACT_ASERR = [
    { a: 'Tareas en cinta aserrín verde, silos de camión', t: 'tt_corr' },
    { a: 'Pasarela barandas H3', t: 'tt_estr' },
    { a: 'Modificar tanque inox para taller afilado', t: 'tt_sold' },
    { a: 'Mover grading a depósito', t: 'tt_movi' },
    { a: 'Reparar carros', t: 'tt_carr' },
    { a: 'Carros hornos', t: 'tt_carr' },
  ];
  const ACT_REMAN = [
    { a: 'Cambio rotativas línea 6 y 7', t: 'tt_rota' },
    { a: 'Cambio burletes, revisar puertas, aspiración 4', t: 'tt_burl' },
    { a: 'Cambiar rotativa aspiración línea 4', t: 'tt_rota' },
    { a: 'Picadora 3 y 4: modificar rampa caída tablas desarmador', t: 'tt_herr' },
    { a: 'Equipo Mereen Joh. mover lugar', t: 'tt_movi' },
    { a: 'Línea de vida en reman', t: 'tt_altu' },
  ];
  const ACT_PELLET = [
    { a: 'Apoyo desarme prensas Pellets', t: 'tt_desm' },
    { a: 'Quitar redler en desuso planta pellets / descargar VTI', t: 'tt_desm' },
  ];
  const ACT_FIN_SEMANA = ['Alan', 'Marco S.', 'Pablo D.', 'Marcos', 'Leal', 'H-10 con Pablo'];
  const ACT_FORESTAL = [
    { a: 'Reparación de cinta de la chipeadora', t: 'tt_corr', ar: 'Chipeadora' },
    { a: 'Fabricación de guardas para playa de acopio', t: 'tt_estr', ar: 'Playa de acopio' },
    { a: 'Soldadura de cuchillas y portacuchillas', t: 'tt_sold', ar: 'Taller central' },
  ];
  const ACT_FRIGO = [
    { a: 'Reparación de rieles de cámara 2', t: 'tt_corr', ar: 'Cámaras' },
    { a: 'Montaje de base para compresor', t: 'tt_mont', ar: 'Sala de máquinas' },
    { a: 'Cambio de perfiles en playa de faena', t: 'tt_herr', ar: 'Playa de faena' },
  ];

  let nroOT = 3865;
  const proximaOT = () => 'OT-' + (nroOT += entre(1, 4));
  const tarifaDe = (cli, fecha, tipo) => {
    const vig = cli.tarifas.filter(t => t.desde <= fecha).sort((a, b) => a.desde < b.desde ? 1 : -1)[0] || cli.tarifas[0];
    return tipo === 'extra' ? vig.extra : (tipo === 'descanso' ? vig.descanso : vig.comun);
  };
  const jornada = () => unoDe([['07:00', '16:30'], ['07:00', '16:30'], ['07:00', '16:30'],
                              ['07:00', '16:00'], ['07:00', '15:30'], ['07:00', '15:00']]);

  /* ---------------- Partes de trabajo ---------------- */
  const partes = [];
  function armarParte(fecha, cli, contacto, area, act, funcIds, opts){
    const o = opts || {};
    const tipoDia = aFecha(fecha).getDay() === DESCANSO ? 'descanso' : 'comun';
    const filas = funcIds.map(fid => {
      const [e, s] = o.jornada || jornada();
      /* alguna fila suelta como hora extra, igual que en las planillas */
      const th = (tipoDia === 'comun' && aVeces(.06)) ? 'extra' : tipoDia;
      return { id: nuevoId('fil'), funcId: fid, entrada: e, salida: s, horas: '',
        tipoHora: th, pu: tarifaDe(cli, fecha, th), descuento: 0 };
    });
    /* el adicional de transporte de los domingos (en la planilla va como una fila de 1,5 h) */
    if (o.transporte) filas.push({ id: nuevoId('fil'), funcId: funcIds[0], entrada: '', salida: '',
      horas: 1.5, tipoHora: 'comun', pu: tarifaDe(cli, fecha, 'comun'), descuento: 0, obs: 'Adic. transp. domingo' });

    const dias = diasEntre(fecha, base);
    let estado = 'curso';
    if (dias < 0) estado = 'pendiente';
    else if (dias === 0) estado = aVeces(.5) ? 'curso' : 'terminado';
    else if (dias <= 5) estado = aVeces(.4) ? 'curso' : 'terminado';
    else if (dias <= 12) estado = aVeces(.35) ? 'terminado' : 'reportado';
    else if (dias <= 26) estado = aVeces(.3) ? 'reportado' : 'facturado';
    else estado = 'facturado';

    const p = {
      id: nuevoId('par'), fecha, clienteId: cli.id, contacto, area,
      tipoId: o.transporte ? act.t : act.t, actividad: act.a, ot: o.ot || '',
      estado, obs: o.obs || '', filas,
      creado: fecha + 'T17:10', creadoPor: 'Freddy Pereira',
    };
    if (estado === 'reportado' || estado === 'facturado') p.reportadoEn = sumarDias(fecha, 7 - aFecha(fecha).getDay() % 7 || 3);
    if (estado === 'facturado') p.facturadoEn = sumarDias(p.reportadoEn, 2);
    partes.push(p);
    return p;
  }

  for (let f = desde; f <= sumarDias(base, 2); f = sumarDias(f, 1)){
    const dia = aFecha(f).getDay();   // 0 dom · 1 lun · … · 6 sáb

    if (dia === DESCANSO){
      /* lunes: descansan, pero a veces se trabaja y se paga lo que corresponde */
      if (aVeces(.14)) armarParte(f, dank, 'Santiago P.', 'Planta de Energía', unoDe(ACT_ENERGIA),
        varios([ids.fre, ids.san, ids.mar, ids.mri], entre(2, 3)),
        { obs: 'Se trabajó el día de descanso por parada de planta.' });
      continue;
    }

    if (dia >= 2 && dia <= 5){
      /* martes a viernes: la planilla de Planta de Energía */
      const j = jornada();
      armarParte(f, dank, 'Santiago P.', 'Planta de Energía', unoDe(ACT_ENERGIA),
        varios([ids.fre, ids.mri, ids.san, ids.mar, ids.wal], entre(3, 4)), { jornada: j });
      /* y casi siempre un segundo frente en Aserraderos */
      if (aVeces(.78)) armarParte(f, dank, 'Santiago P.', 'Aserraderos', unoDe(ACT_ASERR),
        varios([ids.cha, ids.wal, ids.jon, ids.dio], entre(2, 3)), { jornada: j });
      /* de a ratos, apoyo en Planta Pellet */
      if (aVeces(.12)) armarParte(f, dank, 'Gonzalo R.', 'Planta Pellet', unoDe(ACT_PELLET),
        varios([ids.cha, ids.jon, ids.dio, ids.jos], entre(2, 3)), {});
    }

    if (dia === 6 || dia === 0){
      /* sábado y domingo: la planilla de Aserraderos (con N° de OT) */
      const quien = unoDe(ACT_FIN_SEMANA);
      const ot = quien === 'Leal' || quien === 'H-10 con Pablo' ? '' : proximaOT() + (aVeces(.4) ? ' / ' + (nroOT + entre(2, 9)) : '');
      armarParte(f, dank, 'Carlos G.', 'Aserraderos',
        { a: quien + (ot ? ' ' + ot : ''), t: aVeces(.7) ? 'tt_corr' : 'tt_apoy' },
        varios([ids.san, ids.jos, ids.jon, ids.dio, ids.mar, ids.cha], entre(3, 5)),
        { ot, transporte: dia === 0, jornada: ['07:00', '16:30'] });
      /* los sábados, de tanto en tanto, las tareas de Remanufactura */
      if (dia === 6 && aVeces(.35)) armarParte(f, dank, 'Gonzalo R.', 'Remanufactura', unoDe(ACT_REMAN),
        varios([ids.cha, ids.mri, ids.jon, ids.san], entre(2, 3)), { jornada: ['07:00', '16:30'] });
    }

    /* los clientes chicos, cada tanto */
    if (dia >= 2 && dia <= 5 && aVeces(.09)){
      const a = unoDe(ACT_FORESTAL);
      armarParte(f, forestal, 'Álvaro Núñez', a.ar, a, varios([ids.wal, ids.cha, ids.dio], entre(2, 2)), {});
    }
    if (dia >= 2 && dia <= 6 && aVeces(.07)){
      const a = unoDe(ACT_FRIGO);
      armarParte(f, frigo, 'Rosana Méndez', a.ar, a, varios([ids.san, ids.mar, ids.jos], entre(2, 2)), {});
    }
  }

  /* ---------------- Marcas del reloj ----------------
     El reloj marca entrada y salida. Casi siempre coincide con lo imputado a los trabajos,
     pero se dejan a propósito algunos días con diferencia (y algún día marcado sin ningún
     trabajo asignado) para que se vea para qué sirve el control de horas. */
  const marcas = [];
  const porFuncDia = {};
  partes.forEach(p => (p.filas || []).forEach(fi => {
    if (p.fecha > base) return;
    const k = fi.funcId + '|' + p.fecha;
    const h = horasEntre(fi.entrada, fi.salida);
    porFuncDia[k] = porFuncDia[k] || { funcId: fi.funcId, fecha: p.fecha, horas: 0, entrada: fi.entrada || '07:00', salida: fi.salida || '16:30' };
    porFuncDia[k].horas = redondear(porFuncDia[k].horas + (h !== null ? h : (Number(fi.horas) || 0)));
  }));
  Object.values(porFuncDia).forEach(d => {
    let horas = d.horas, entrada = d.entrada, salida = d.salida;
    if (aVeces(.10)){                       // el reloj marcó más de lo que quedó imputado
      horas = redondear(horas + unoDe([0.5, 1, 1.5, 2]));
      salida = unoDe(['17:00', '17:30', '18:00']);
    } else if (aVeces(.04)){                // entró más tarde: marcó menos
      horas = redondear(Math.max(1, horas - unoDe([0.5, 1])));
      entrada = '07:30';
    }
    marcas.push({ id: nuevoId('mar'), funcId: d.funcId, fecha: d.fecha, entrada, salida, horas,
      extra: horas > 9.5 ? redondear(horas - 9.5) : 0, origen: 'Rep. Reloj' });
  });
  /* dos o tres días marcados que no están en ningún trabajo (lo que más plata hace perder) */
  [[-4, ids.dio], [-9, ids.jos], [-16, ids.jon], [-23, ids.wal]].forEach(([d, fid]) => {
    const f = sumarDias(base, d);
    if (aFecha(f).getDay() === DESCANSO) return;
    if (marcas.some(m => m.funcId === fid && m.fecha === f)) return;
    marcas.push({ id: nuevoId('mar'), funcId: fid, fecha: f, entrada: '07:00', salida: '16:30', horas: 9.5, extra: 0, origen: 'Rep. Reloj' });
  });

  /* ---------------- Adelantos (los de la planilla de setiembre) ---------------- */
  const adelantos = [
    { id: 'ad_1', fecha: sumarDias(base, -34), funcId: ids.dio, monto: 2000,  nota: 'Pedido a mitad de mes', descontado: true },
    { id: 'ad_2', fecha: sumarDias(base, -32), funcId: ids.jos, monto: 10000, nota: '', descontado: true },
    { id: 'ad_3', fecha: sumarDias(base, -30), funcId: ids.jon, monto: 10000, nota: '', descontado: true },
    { id: 'ad_4', fecha: sumarDias(base, -12), funcId: ids.jos, monto: 8000,  nota: 'Adelanto de quincena', descontado: false },
    { id: 'ad_5', fecha: sumarDias(base, -6),  funcId: ids.dio, monto: 3000,  nota: '', descontado: false },
    { id: 'ad_6', fecha: sumarDias(base, -3),  funcId: ids.mri, monto: 5000,  nota: 'Para pagar el mecánico', descontado: false },
  ];

  /* ---------------- Cobros (lo que se le facturó a cada cliente) ----------------
     Un cobro por semana y por contacto, con los partes que entraron en ese reporte. */
  const cobros = [];
  const grupos = {};
  partes.filter(p => p.estado === 'facturado' || p.estado === 'reportado').forEach(p => {
    const lun = (() => { const d = aFecha(p.fecha); d.setDate(d.getDate() - ((d.getDay() - 2 + 7) % 7)); return iso(d); })();
    const k = p.clienteId + '|' + p.contacto + '|' + lun;
    grupos[k] = grupos[k] || { clienteId: p.clienteId, contacto: p.contacto, desde: lun, hasta: sumarDias(lun, 6), partes: [] };
    grupos[k].partes.push(p);
  });
  Object.values(grupos).forEach((g, i) => {
    const facturados = g.partes.filter(p => p.estado === 'facturado');
    if (!facturados.length) return;
    const sub = redondear(sumar(facturados, p => sumar(p.filas, fi => {
      const h = horasEntre(fi.entrada, fi.salida); return redondear(Math.max(0, (h !== null ? h : Number(fi.horas) || 0) * fi.pu - (fi.descuento || 0)));
    })));
    const iva = redondear(sub * 22 / 100);
    const cli = clientes.find(c => c.id === g.clienteId);
    const fecha = sumarDias(g.hasta, 3);
    const vence = sumarDias(fecha, cli.diasPago);
    const dias = diasEntre(fecha, base);
    let estado = 'pendiente', fechaCobro = '', medio = '';
    if (dias > 46){ estado = 'cobrado'; fechaCobro = sumarDias(vence, entre(-3, 4)); medio = 'Transferencia'; }
    else if (dias > 34 && aVeces(.7)){ estado = 'cobrado'; fechaCobro = sumarDias(vence, entre(-2, 3)); medio = 'Transferencia'; }
    cobros.push({
      id: nuevoId('cob'), fecha, clienteId: g.clienteId, contacto: g.contacto,
      concepto: `Horas del ${fCorta(g.desde)} al ${fCorta(g.hasta)} · ${g.contacto}`,
      periodoDesde: g.desde, periodoHasta: g.hasta,
      subtotal: sub, iva, total: redondear(sub + iva),
      estado, vence, fechaCobro, medio, factura: 'A-' + (3100 + i),
      partes: facturados.map(p => p.id), nota: '',
    });
  });
  /* que quede uno vencido a la vista: es el aviso que más sirve */
  const pend = cobros.filter(c => c.estado !== 'cobrado').sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  if (pend[0]) pend[0].vence = sumarDias(base, -9);
  if (pend[1]) pend[1].vence = sumarDias(base, 4);

  /* ---------------- Listo ---------------- */
  return {
    version: VERSION_DATOS, base,
    config: configPorDefecto(),
    clientes, tiposTrabajo, funcionarios, cuadrillas, partes, marcas, adelantos, cobros,
    log: [{ id: nuevoId('log'), fecha: ahora(), usuario: 'Sistema', accion: 'Datos de ejemplo cargados', ref: '' }],
  };
}

/* ---------- Pantalla de bloqueo ----------
   En la demostración es un bloqueo de pantalla, no una seguridad real.

   >>> AQUÍ IRÍA EL LOGIN REAL <<<
   En la versión en la nube, Freddy entra con su cuenta de Firebase Authentication
   (correo + contraseña, con «olvidé mi contraseña» por mail) y los permisos se
   controlan en el servidor, en firestore.rules — nunca en el navegador, y nunca
   con una contraseña escrita en el código como esta.
*/
function mostrarBloqueo(){
  $('#bq-wydan').src = LOGO_WYDAN_ICONO;
  $('#bq-saludo').textContent = saludo() + ', ' + primerNombre(USUARIO_DEMO.nombre);
  $('#bq-fecha').textContent = fLarga(hoy());
  $('#bq-error').innerHTML = MODO_DEMO ? `Contraseña de la demostración: <b>${CLAVE_DEMO}</b>` : '';
  $('#bq-error').classList.remove('mal');
  $('#bq-clave').value = '';
  $('#bq-clave').type = 'password';
  $('#bq-ver').innerHTML = ico('ojo');
  $('#app').classList.add('hidden'); $('#modal').classList.add('hidden');
  $('#bloqueo').classList.remove('hidden', 'saliendo');
  if (!esCelular()) setTimeout(() => $('#bq-clave').focus(), 220);
}
/* Mostrar u ocultar lo que se escribe (en la demo la contraseña está a la vista igual) */
function verClave(){
  const i = $('#bq-clave'), b = $('#bq-ver');
  const ver = i.type === 'password';
  i.type = ver ? 'text' : 'password';
  b.innerHTML = ico(ver ? 'ojoNo' : 'ojo');
  b.setAttribute('aria-label', ver ? 'Ocultar la contraseña' : 'Ver la contraseña');
  i.focus();
}
function validarClave(){
  const v = ($('#bq-clave').value || '').trim();
  if (v === CLAVE_DEMO){
    Store.usuario = { ...USUARIO_DEMO };
    Store.registrar('Ingresó a la página'); Store.guardar();
    $('#bloqueo').classList.add('saliendo');
    setTimeout(() => { $('#bloqueo').classList.add('hidden'); cargando(600, () => abrirApp(true)); }, 380);
  } else {
    const t = $('#bq-tarjeta');
    t.classList.remove('temblor'); void t.offsetWidth; t.classList.add('temblor');
    const e = $('#bq-error');
    e.classList.add('mal');
    e.innerHTML = 'Contraseña incorrecta.' + (MODO_DEMO ? ` Probá con <b>${CLAVE_DEMO}</b>` : '');
    $('#bq-clave').value = ''; $('#bq-clave').focus();
  }
}

/* ---------- Bloquear y bloqueo automático por inactividad ---------- */
function bloquear(silencioso){
  if (!Store.usuario) return;
  Store.registrar('Bloqueó la pantalla'); Store.guardar();
  cerrarHoja();
  if (!silencioso) mostrarBloqueo();
}
let ultimaActividad = Date.now();
['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => ultimaActividad = Date.now(), { passive: true, capture: true }));
setInterval(() => {
  if (!Store.data || !Store.usuario || $('#app').classList.contains('hidden')) return;
  const min = Number(cfg().bloqueoMin) || 0;
  if (min && Date.now() - ultimaActividad > min * 60000) bloquear();
}, 15000);

  $('#lat-usuario').innerHTML = `<span class="avatar" style="--c:${colorFunc('fu_fre')}">${iniciales(u.nombre)}</span>
    <div><b>${esc(u.nombre)}</b><small>${esc(u.rol)}</small></div>`;

/* ---------- Ir a una sección ---------- */
function irA(id, sub){
  if (!SECCIONES.some(s => s.id === id)) id = 'panel';
  seccion = id;
  if (sub) subSeccion[id] = sub;
  cerrarHoja();
  if (pilaModal.length) cerrarTodo();
  pintarNav(); pintarVista();
  window.scrollTo({ top: 0, behavior: sinMovimiento() ? 'auto' : 'smooth' });
}
function pintarNav(){
  const n = conteos();
  $('#lat-nav').innerHTML = SECCIONES.map(s => `
    <button class="lat-item ${s.id === seccion ? 'on' : ''}" onclick="irA('${s.id}')">
      ${ico(s.ico)}<span>${s.t}</span>${n[s.id] ? `<i class="lat-n ${n[s.id + 'Alerta'] ? 'alerta' : ''}">${n[s.id]}</i>` : ''}
    </button>`).join('');
  $('#barra-inf').innerHTML = EN_BARRA.map(id => {
    const s = SECCIONES.find(x => x.id === id);
    return `<button class="${s.id === seccion ? 'on' : ''}" onclick="irA('${s.id}')">${ico(s.ico)}<span>${s.t.slice(0, 11)}</span>${n[s.id] ? `<i>${n[s.id]}</i>` : ''}</button>`;
  }).join('') + `<button class="${EN_BARRA.includes(seccion) ? '' : 'on'}" onclick="abrirMas()">${ico('menu')}<span>Más</span></button>`;
  pintarIconos($('#lateral')); pintarIconos($('#barra-inf'));

  const s = SECCIONES.find(x => x.id === seccion);
  $('#enc-fecha').textContent = fLarga(hoy());
  $('#enc-titulo').textContent = s.titulo || `${saludo()}, ${primerNombre((Store.usuario || USUARIO_DEMO).nombre)}`;
  const av = avisos();
  const crit = av.filter(a => a.tipo !== 'normal').length;
  $('#campana-n').textContent = crit || '';
  $('#campana-n').classList.toggle('hidden', !crit);
}
/* Los numeritos de cada sección del menú */
function conteos(){
  const term = Store.listar('partes', p => p.estado === 'terminado').length;
  const venc = cobrosDe(c => estadoCobro(c) === 'vencido').length;
  const mes = mesDe(hoy());
  const dif = sinImputarDe(mes + '-01', mes + '-31').conDif;
  return {
    trabajos: Store.listar('partes', p => p.estado === 'curso' && p.fecha <= hoy()).length,
    funcionarios: dif, funcionariosAlerta: dif > 0,
    cobros: venc, cobrosAlerta: venc > 0,
    reportes: term, reportesAlerta: term > 0,
  };
}

/* ---------- Dibujar la sección que está abierta ---------- */
function pintarVista(){
  const v = $('#vista');
  const sub = subSeccion[seccion];
  if (seccion === 'panel')             v.innerHTML = vistaPanel();
  else if (seccion === 'trabajos')     v.innerHTML = vistaTrabajos();
  else if (seccion === 'clientes')     v.innerHTML = vistaClientes();
  else if (seccion === 'funcionarios') v.innerHTML = vistaFuncionarios(sub);
  else if (seccion === 'cobros')       v.innerHTML = vistaCobros();
  else if (seccion === 'reportes')     v.innerHTML = vistaReportes();
  else if (seccion === 'config')       v.innerHTML = vistaConfig(sub);
  pintarIconos(v);
  pintarNav();
  if (seccion === 'panel') animarNumeros('#vista');
  if (typeof alPintar === 'function') alPintar(seccion);
}

function abrirHoja(html){
  $('#hoja-caja').innerHTML = html;
  $('#hoja').classList.remove('hidden');
  requestAnimationFrame(() => $('#hoja').classList.add('abierta'));
  pintarIconos($('#hoja'));
  document.body.classList.add('con-modal');
}
function cerrarHoja(){
  $('#hoja').classList.remove('abierta');
  document.body.classList.remove('con-modal');
  setTimeout(() => $('#hoja').classList.add('hidden'), 220);
}

/* ---------- Buscador de arriba ---------- */
function iniciarBuscador(){
  const inp = $('#busq-global'), caja = $('#busq-res');
  const cerrar = () => caja.classList.add('hidden');
  inp.addEventListener('input', () => {
    const q = sinTildes(inp.value);
    if (q.length < 2) return cerrar();
    const r = buscar(q);
    caja.innerHTML = r.length ? r.slice(0, 24).map(x =>
      `<button onclick="${x.js}; $('#busq-global').value=''; $('#busq-res').classList.add('hidden')">
        ${ico(x.ico)}<span><b>${x.t}</b><small>${x.s}</small></span></button>`).join('')
      : `<div class="busq-nada">No encontré nada con «${esc(inp.value)}».</div>`;
    caja.classList.remove('hidden');
    pintarIconos(caja);
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Escape'){ inp.value = ''; cerrar(); } });
  document.addEventListener('click', e => { if (!e.target.closest('#buscador')) cerrar(); });
}
function buscar(q){
  const out = [];
  funcActivos().forEach(f => {
    if (sinTildes(f.nombre).includes(q) || String(f.idReloj) === q)
      out.push({ ico: 'funcionarios', t: esc(f.nombre), s: `${f.especialidad} · ${pesos(f.valorHora)}/h`, js: `fichaFuncionario('${f.id}')` });
  });
  Store.listar('clientes').forEach(c => {
    if (sinTildes(c.nombre).includes(q) || sinTildes(c.razon || '').includes(q))
      out.push({ ico: 'clientes', t: esc(c.nombre), s: `${(c.areas || []).length} áreas · saldo ${pesos(saldoCliente(c.id))}`, js: `fichaCliente('${c.id}')` });
    (c.contactos || []).forEach(k => { if (sinTildes(k.nombre).includes(q))
      out.push({ ico: 'usuario', t: esc(k.nombre), s: `Contacto de ${c.nombre} · ${k.cargo || ''}`, js: `fichaCliente('${c.id}')` }); });
  });
  Store.listar('partes').forEach(p => {
    const texto = sinTildes(`${p.actividad} ${p.ot} ${p.area} ${p.contacto}`);
    if (texto.includes(q))
      out.push({ ico: 'trabajos', t: esc(p.actividad || 'Parte'), s: `${fFecha(p.fecha)} · ${nombreCliente(p.clienteId)} · ${p.area}`, js: `fichaParte('${p.id}')` });
  });
  tiposActivos().forEach(t => { if (sinTildes(t.nombre).includes(q))
    out.push({ ico: 'config', t: esc(t.nombre), s: 'Tipo de trabajo', js: `irA('config','tipos')` }); });
  return out;
}

/* =====================================================================

  const fSem = filasEntre(desdeSem, hastaSem);
  const fMesL = filasEntre(desdeMes, hastaMes);
  const hHoy = sumar(fHoy, x => x.horasCalc);
  const hSem = sumar(fSem, x => x.horasCalc);
  const hMes = sumar(fMesL, x => x.horasCalc);
  const extraMes = sumar(fMesL.filter(x => x.tipoHora !== 'comun'), x => x.horasCalc);
  const tSem = totalesDe(partesEntre(desdeSem, hastaSem));
  const si = sinImputarDe(desdeMes, hastaMes);
  const mg = costoYMargen(fMesL);

  return `
  ${si.horas > 0 ? `<div class="nota-aviso critico">${ico('reloj')}
    <div><b>${fHoras(si.horas)} marcadas en el reloj este mes no están puestas en ningún trabajo.</b>
    Son horas que se pagan y no se le cobran a nadie: <b>${pesos(si.venta)}</b> sin facturar.
    En total hay ${si.conDif} día${si.conDif > 1 ? 's' : ''} del mes con diferencia entre el reloj y los partes.
    <button class="btn-link" onclick="irA('funcionarios','control')">Ver el control de horas</button></div></div>` : ''}

  <div class="kpis">
    <button class="kpi" onclick="irA('trabajos')">
      <span class="kpi-t">${ico('reloj')} Horas de hoy</span>
      <span class="kpi-v" data-contar="${hHoy}" data-f="horas">${fHorasN(hHoy)}</span>
      <small>${fHoy.length} ${fHoy.length === 1 ? 'funcionario' : 'funcionarios'} en ${new Set(fHoy.map(x => x.parte.id)).size} trabajo(s)</small>
    </button>
    <button class="kpi" onclick="irA('trabajos')">
      <span class="kpi-t">${ico('calendario')} Horas de la semana</span>
      <span class="kpi-v" data-contar="${hSem}" data-f="horas">${fHorasN(hSem)}</span>
      <small>${rotuloSemana(h)}</small>
    </button>
    <button class="kpi k-naranja" onclick="irA('reportes')">
      <span class="kpi-t">${ico('plata')} A facturar de la semana</span>
      <span class="kpi-v" data-contar="${tSem.total}" data-f="plata">${pesos(tSem.total)}</span>
      <small>${pesos(tSem.subtotal)} + IVA ${pesos(tSem.iva)}</small>
    </button>
    <button class="kpi ${vencido() ? 'k-critico' : 'k-ok'}" onclick="irA('cobros')">
      <span class="kpi-t">${ico('cobros')} Por cobrar</span>
      <span class="kpi-v" data-contar="${porCobrar()}" data-f="plata">${pesos(porCobrar())}</span>
      <small>${vencido() ? `<span class="txt-critico">${pesos(vencido())} vencido</span>` : 'Nada vencido'}</small>
    </button>
  </div>

  <details class="mas-numeros">
    <summary>${ico('abajo')} Ver más números del mes</summary>
    <div class="kpis">
      <div class="kpi"><span class="kpi-t">${ico('reloj')} Horas del mes</span>
        <span class="kpi-v">${fHorasN(hMes)}</span><small>${fMesL.length} filas cargadas</small></div>
      <div class="kpi"><span class="kpi-t">${ico('rayo')} Extra y día de descanso</span>
        <span class="kpi-v">${fHorasN(extraMes)}</span><small>${hMes ? Math.round(extraMes / hMes * 100) : 0}% de las horas del mes</small></div>
      <div class="kpi ${si.horas ? 'k-critico' : 'k-ok'}"><span class="kpi-t">${ico('alerta')} Horas sin imputar</span>
        <span class="kpi-v">${fHorasN(si.horas)}</span><small>${pesos(si.venta)} sin facturar</small></div>
      <div class="kpi"><span class="kpi-t">${ico('grafico')} Margen del mes</span>
        <span class="kpi-v">${pesos(mg.margen)}</span><small>${mg.pct}% · ${pesos(mg.porHora)} por hora</small></div>
    </div>
  </details>

  <div class="tira-estados">
    ${ESTADOS.map(e => { const n = Store.listar('partes', p => p.estado === e.id && p.fecha >= desdeMes && p.fecha <= hastaMes).length;
      return `<button class="tira-e ${e.color} ${n ? '' : 'cero'}" onclick="irA('trabajos','${e.id}')"><b>${n}</b><span>${e.corto}</span></button>`; }).join('')}

}

/* ---------- Quién está trabajando hoy ---------- */
function panelHoy(filas){
  if (!filas.length) return vacio('Todavía no hay nada cargado para hoy.',
    `<button class="btn btn-naranja" onclick="nuevoParte()">${ico('mas')} Cargar el parte de hoy</button>`);
  const porParte = {};
  filas.forEach(f => { porParte[f.parte.id] = porParte[f.parte.id] || { p: f.parte, filas: [] }; porParte[f.parte.id].filas.push(f); });
  return `<div class="lista-filas">${Object.values(porParte).map(({ p, filas }) => `
    <button class="fila-simple" onclick="fichaParte('${p.id}')">
      <span class="fa-txt"><b>${esc(p.actividad || 'Sin descripción')}</b>
        <small>${esc(nombreCliente(p.clienteId))} · ${esc(p.area || 'sin área')}${p.ot ? ' · ' + esc(p.ot) : ''}</small>
        <span class="t-marcas" style="display:flex;gap:4px;margin-top:5px">${filas.map(f =>
          `<span class="avatar mini" style="--c:${colorFunc(f.funcId)}" title="${esc(nombreFunc(f.funcId))} · ${fHoras(f.horasCalc)}">${iniciales(nombreFunc(f.funcId))}</span>`).join('')}</span>
      </span>
      <span class="fa-der" style="text-align:right">
        <b>${fHoras(sumar(filas, x => x.horasCalc))}</b><br>${etqEstado(p.estado)}
      </span>
    </button>`).join('')}</div>`;
}

/* ---------- A facturar de la semana, por cliente y contacto ---------- */
function panelAFacturar(desde, hasta){
  const partes = partesEntre(desde, hasta);
  if (!partes.length) return vacio('No hay trabajos cargados en esta semana.');
  const g = {};
  partes.forEach(p => {
    const k = p.clienteId + '|' + p.contacto;
    g[k] = g[k] || { clienteId: p.clienteId, contacto: p.contacto, partes: [] };
    g[k].partes.push(p);
  });
  const filas = Object.values(g).map(x => ({ ...x, t: totalesDe(x.partes) })).sort((a, b) => b.t.total - a.t.total);
  const tot = totalesDe(partes);
  return `<div class="tabla-resp"><table class="tabla compacta">
    <thead><tr><th>Cliente / contacto</th><th class="num">Horas</th><th class="num">Subtotal</th><th class="num">Total con IVA</th></tr></thead>
    <tbody>${filas.map(f => `<tr>
      <td><b>${esc(nombreCliente(f.clienteId))}</b><small>${esc(f.contacto || '—')}</small></td>
      <td class="num">${fHorasN(f.t.horas)}</td>
      <td class="num">${pesos(f.t.subtotal)}</td>
      <td class="num"><b>${pesos(f.t.total)}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total de la semana</td><td class="num">${fHorasN(tot.horas)}</td>
      <td class="num">${pesos(tot.subtotal)}</td><td class="num">${pesos(tot.total)}</td></tr></tfoot>
  </table></div>
  <div class="chico suave" style="margin-top:8px">IVA ${cfg().iva}% incluido en la última columna.</div>`;
}

/* ---------- Gráfico de barras: horas por funcionario ---------- */
function graficoFuncionarios(desde, hasta){
  const datos = funcActivos().map(f => ({ f, h: horasFuncionario(f.id, desde, hasta) }))
    .filter(x => x.h.total > 0).sort((a, b) => b.h.total - a.h.total);
  if (!datos.length) return vacio('Todavía no hay horas cargadas este mes.');
  const max = Math.max(...datos.map(x => x.h.total)) || 1;
  return `<div class="grafico">${datos.map(x => {
    const alto = p => `height:${(p / max * 100).toFixed(1)}%`;
    return `<div class="g-col" title="${esc(x.f.nombre)}: ${fHoras(x.h.total)}">
      <span class="g-total">${fHorasN(x.h.total)}</span>
      <div class="g-barra" style="height:${(x.h.total / max * 100).toFixed(1)}%">
        ${x.h.descanso ? `<i class="g-desc" style="flex:${x.h.descanso}"></i>` : ''}
        ${x.h.extra ? `<i class="g-ext" style="flex:${x.h.extra}"></i>` : ''}
        <i class="g-com" style="flex:${x.h.comun}"></i>
      </div>
      <span class="g-pie">${esc(primerNombre(x.f.nombre))}</span>
    </div>`; }).join('')}</div>`;
}

/* ---------- Lista con barra de proporción ---------- */
function listaProporcion(filas, clave){
  if (!filas.length) return vacio('Sin datos en este período.');
  const g = {};
  filas.forEach(f => { const k = clave(f); g[k] = g[k] || { k, horas: 0, plata: 0 }; g[k].horas = redondear(g[k].horas + f.horasCalc); g[k].plata = redondear(g[k].plata + f.totalCalc); });
  const l = Object.values(g).sort((a, b) => b.horas - a.horas);
  const tot = sumar(l, x => x.horas) || 1;
  return l.slice(0, 8).map(x => `<div class="fila-prop">
    <span>${esc(x.k)}</span>
    <span class="bb"><i style="width:${(x.horas / tot * 100).toFixed(1)}%"></i></span>
    <span class="pp">${Math.round(x.horas / tot * 100)}%</span>
    <b>${fHorasN(x.horas)} h</b></div>`).join('')
    + (l.length > 8 ? `<div class="chico suave" style="margin-top:8px">y ${l.length - 8} más…</div>` : '');
}

}
function trVista(v){ filtroTr.vista = v; pintarVista(); }
function trFiltro(k, v){ filtroTr[k] = v; pintarVista(); }
function trSemana(d){ filtroTr.semana = d ? sumarDias(filtroTr.semana, d) : inicioSemana(hoy()); pintarVista(); }
function trLimpiar(){ Object.assign(filtroTr, { clienteId: '', area: '', tipoId: '', funcId: '', estado: '', q: '' }); pintarVista(); }
function pintarSoloLista(){
  const c = $('#tr-lista'); if (!c) return pintarVista();
  c.innerHTML = listaPartes(true); pintarIconos(c);
}

/* ---------- Qué partes pasan los filtros ---------- */
function partesFiltrados(){
  const q = sinTildes(filtroTr.q);
  return Store.listar('partes', p => {
    if (filtroTr.estado && p.estado !== filtroTr.estado) return false;
    if (filtroTr.clienteId && p.clienteId !== filtroTr.clienteId) return false;
    if (filtroTr.area && p.area !== filtroTr.area) return false;
    if (filtroTr.tipoId && p.tipoId !== filtroTr.tipoId) return false;
    if (filtroTr.funcId && !(p.filas || []).some(f => f.funcId === filtroTr.funcId)) return false;
    if (q && !sinTildes(`${p.actividad} ${p.ot} ${p.area} ${p.contacto} ${nombreTipo(p.tipoId)}`).includes(q)) return false;
    return true;
  }).sort((a, b) => a.fecha < b.fecha ? 1 : (a.fecha > b.fecha ? -1 : 0));
}

/* ---------- Lista agrupada por día ---------- */

            <th class="num">Horas</th><th class="num solo-compu">Total</th><th>Estado</th>
          </tr></thead>

                ${esDiaDescanso(d) ? ico('alerta') + ' ' : ''}${fDiaCorto(d)}${diasEntre(hoy(), d) === 0 ? ' · hoy' : ''}
                <span class="suave" style="font-family:var(--f-texto);font-size:13px;font-weight:400">

              </td></tr>` + delDia.map(p => filaParte(p)).join('');

        </table></div></div>`;

}
function filaParte(p){

/* ---------- Vista de semana (calendario) ---------- */

/* ---------- Repetir el parte anterior ---------- */
async function repetirParteAnterior(){
  const dia = ultimoDiaConPartes(sumarDias(hoy(), 1));
  if (!dia) return avisar('Todavía no hay partes', 'Cargá el primero con el botón «Nuevo parte».');
  const partes = partesDelDia(dia);
  const ok = await confirmar({
    titulo: `¿Repetir los partes del ${fDiaCorto(dia)}?`,
    texto: `Se van a crear <b>${partes.length} parte(s)</b> con fecha de <b>hoy</b>, con las mismas personas y las mismas horas:
      <ul class="lista-simple" style="margin-top:8px">${partes.map(p => `<li><span>${esc(p.actividad)}<small>${esc(p.area)} · ${(p.filas || []).length} personas</small></span></li>`).join('')}</ul>
      <div class="chico suave" style="margin-top:8px">Después los podés editar uno por uno.</div>`,
    si: 'Sí, repetir', no: 'Volver',
  });
  if (!ok) return;
  const nuevos = partes.map(p => copiarParte(p.id, hoy()));
  aviso(`${nuevos.length} parte(s) copiados a hoy`, { deshacer: () => { nuevos.forEach(n => Store.borrar('partes', n.id)); pintarVista(); } });
  pintarVista();
}

/* ---------- Exportar lo que se está viendo ---------- */
function exportarPartesVisibles(){
  const filas = [];
  partesFiltrados().forEach(p => (p.filas || []).forEach(f => filas.push({ p, f })));
  if (!filas.length) return aviso('No hay nada para exportar', { tipo: 'error' });
  exportarExcel('Trabajos', [
    { t: 'Fecha', v: x => fFecha(x.p.fecha) },
    { t: 'Día', v: x => DIAS[diaSemana(x.p.fecha)] },
    { t: 'Cliente', v: x => nombreCliente(x.p.clienteId) },
    { t: 'Contacto', v: x => x.p.contacto },
    { t: 'Área', v: x => x.p.area },
    { t: 'Tipo de trabajo', v: x => nombreTipo(x.p.tipoId) },
    { t: 'Actividad', v: x => x.p.actividad },
    { t: 'N° OT', v: x => x.p.ot },
    { t: 'Funcionario', v: x => nombreFunc(x.f.funcId) },
    { t: 'Entrada', v: x => x.f.entrada },
    { t: 'Salida', v: x => x.f.salida },
    { t: 'Horas', v: x => horasFila(x.f) },
    { t: 'Tipo de hora', v: x => (TIPOS_HORA.find(t => t.id === (x.f.tipoHora || 'comun')) || {}).nombre },
    { t: 'P.U.', v: x => x.f.pu },
    { t: 'Descuento', v: x => x.f.descuento || 0 },
    { t: 'Total', v: x => totalFila(x.f) },
    { t: 'Estado', v: x => estadoDe(x.p.estado).nombre },
  ], filas);
}


/* ===== js/11-parte.js ===== */
/* =====================================================================
   EL PARTE DE TRABAJO (el corazón de la herramienta)
   Cabecera del trabajo + una fila por funcionario con sus horas.
   Las horas y los totales se calculan solos mientras se escribe.
   ===================================================================== */
let pe = null;      // el parte que se está editando (borrador)
let peNuevo = false;

function nuevoParte(fecha){
  const cli = clientePrincipal();
  const c = clienteDe(cli);
  pe = {
    id: null, fecha: fecha || hoy(), clienteId: cli,
    contacto: c && c.contactos && c.contactos[0] ? c.contactos[0].nombre : '',
    area: '', tipoId: '', actividad: '', ot: '', estado: 'curso', obs: '', filas: [],
  };
  peNuevo = true;
  abrirModal(pantallaParte);
}
function fichaParte(id){
  const p = Store.obtener('partes', id); if (!p) return;
  pe = JSON.parse(JSON.stringify(p));
  pe.filas = pe.filas || [];
  peNuevo = false;
  abrirModal(pantallaParte);
}

/* ---------- La ventana ---------- */

      ${desc ? `<div class="nota-aviso">${ico('alerta')}<div><b>${DIAS[cfg().diaDescanso].replace(/^./, m => m.toUpperCase())}: día de descanso.</b>
        Las horas de este día se marcan solas como «día de descanso» y se cobran con el recargo que está en Configuración.</div></div>` : ''}

      <div class="grilla-campos">
        ${campo('Fecha', `<input type="date" name="fecha" value="${pe.fecha}" onchange="peCambiarFecha(this.value)">`)}
        ${campo('Cliente', `<select name="clienteId" onchange="peCambiarCliente(this.value)">
          ${opciones(Store.listar('clientes').map(x => ({ v: x.id, t: x.nombre })), pe.clienteId)}</select>`)}

        ${campo('Área / centro de costo', `<input name="area" list="pe-areas" class="con-lista" value="${esc(pe.area)}"
          oninput="peSet('area',this.value)" placeholder="Ej.: Planta de Energía">
          <datalist id="pe-areas">${(c && c.areas || []).map(a => `<option value="${esc(a)}"></option>`).join('')}</datalist>`)}
        ${campo('Tipo de trabajo', `<select name="tipoId" onchange="peSet('tipoId',this.value)">
          ${opciones(tiposActivos().map(x => ({ v: x.id, t: x.nombre })), pe.tipoId, '— elegir —')}</select>`)}
        ${campo('N° de OT del cliente', `<input name="ot" value="${esc(pe.ot)}" oninput="peSet('ot',this.value)" placeholder="Ej.: OT-3954 / 3972">`)}
        ${campo('Actividad desarrollada', `<input name="actividad" list="pe-act" class="con-lista" value="${esc(pe.actividad)}"
          oninput="peSet('actividad',this.value)" placeholder="Lo que se hizo, como va en el reporte">
          <datalist id="pe-act">${actividadesUsadas().map(a => `<option value="${esc(a)}"></option>`).join('')}</datalist>`, 'ancho')}
        ${campo('Estado', `<select name="estado" onchange="peSet('estado',this.value)">
          ${opciones(ESTADOS.map(e => ({ v: e.id, t: e.nombre })), pe.estado)}</select>`)}
        ${campo('Observaciones', `<input name="obs" value="${esc(pe.obs)}" oninput="peSet('obs',this.value)" placeholder="Opcional">`, 'doble')}
      </div>

      <div class="bloque">
        <b>${ico('funcionarios')} Funcionarios y horas</b>
        <div class="botonera" style="margin:10px 0 4px">
          <button class="btn btn-azul chico" onclick="peAgregar()">${ico('mas')} Agregar funcionario</button>

            ${opciones(cuadrillas.map(x => ({ v: x.id, t: x.nombre })), '', '＋ Cargar una cuadrilla…')}</select>` : ''}
          ${pe.filas.length ? `<select onchange="peJornadaTodos(this.value); this.value=''" aria-label="Poner la misma jornada a todos" style="width:auto;min-height:34px">

        <div class="kpi chico k-naranja"><span class="kpi-t">Total a facturar</span><span class="kpi-v" id="pe-tot">${pesos(t.total)}</span>

      </div>
      ${peNuevo ? '' : `<div class="chico suave" style="margin-top:10px">Cargado por ${esc(pe.creadoPor || '—')} el ${fFecha((pe.creado || '').slice(0, 10))}${pe.editado ? ` · última corrección ${fFecha(pe.editado.slice(0, 10))}` : ''}</div>`}`,
    pie: `
      ${peNuevo ? '' : masOpciones([
        { ico: 'copiar', t: 'Copiar a otro día', js: `peCopiar()` },
        { ico: 'repetir', t: 'Duplicar para mañana', js: `peCopiarA('${sumarDias(pe.fecha, 1)}')` },
        { ico: 'imprimir', t: 'Imprimir este parte', js: `imprimirParte('${pe.id}')` },
        pe.estado !== 'facturado' ? { ico: 'basura', t: 'Borrar el parte', js: `peBorrar()` } : null,
      ])}
      <span class="flex1"></span>
      <button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button>
      ${!peNuevo && pe.estado !== 'facturado' ? `<button class="btn btn-linea" onclick="peAvanzar()">${ico('flecha')} ${estadoDe(proximoEstado(pe.estado)).nombre}</button>` : ''}
      <button class="btn btn-naranja" onclick="peGuardar()">${ico('check')} Guardar</button>`,
  };
}
function peDetalleHoras(t){
  const p = [];
  if (t.porTipo.comun) p.push(`${fHorasN(t.porTipo.comun)} comunes`);
  if (t.porTipo.extra) p.push(`${fHorasN(t.porTipo.extra)} extra`);
  if (t.porTipo.descanso) p.push(`${fHorasN(t.porTipo.descanso)} de descanso`);
  return p.join(' · ') || 'Todavía sin horas';
}
const actividadesUsadas = () => [...new Set(Store.listar('partes').map(p => p.actividad).filter(Boolean))].sort().slice(0, 60);

/* ---------- La tabla de funcionarios ---------- */
function peTabla(){
  if (!pe.filas.length) return `<div class="vacio" style="padding:14px">${ico('funcionarios')}
    <p>Todavía no hay nadie en este parte.</p>
    <button class="btn btn-azul" onclick="peAgregar()">${ico('mas')} Agregar el primer funcionario</button></div>`;
  return `<div class="tabla-resp"><table class="tabla compacta" id="pe-tabla">
    <thead><tr>
      <th>Funcionario</th><th>Entrada</th><th>Salida</th><th class="num">Horas</th>
      <th>Tipo de hora</th><th class="num">P.U.</th><th class="num solo-compu">Desc.</th><th class="num">Total</th><th></th>
    </tr></thead>
    <tbody>${pe.filas.map((f, i) => peFila(f, i)).join('')}</tbody>
  </table></div>
  <div class="chico suave" style="margin-top:6px">Si ponés entrada y salida, las horas se calculan solas. Si dejás la entrada vacía, podés escribir las horas a mano.</div>`;
}
function peFila(f, i){
  const h = horasFila(f), sinHoras = !f.entrada && !f.salida;
  const pasada = h > cfg().jornadaHoras + 0.01;
  return `<tr data-i="${i}">
    <td><select onchange="peFilaSet(${i},'funcId',this.value)" aria-label="Funcionario">
      ${opciones(funcActivos().map(x => ({ v: x.id, t: x.nombre })), f.funcId, '— elegir —')}</select></td>
    <td><input type="time" value="${esc(f.entrada || '')}" onchange="peFilaSet(${i},'entrada',this.value)" aria-label="Entrada" style="min-width:104px"></td>
    <td><input type="time" value="${esc(f.salida || '')}" onchange="peFilaSet(${i},'salida',this.value)" aria-label="Salida" style="min-width:104px"></td>
    <td class="num">${sinHoras
      ? `<input type="number" step="0.25" min="0" value="${f.horas === '' ? '' : f.horas}" oninput="peFilaSet(${i},'horas',this.value)" aria-label="Horas" style="width:78px;text-align:right">`
      : `<b class="pe-h ${pasada ? 'txt-alerta' : ''}">${fHorasN(h)}</b>`}</td>
    <td><select onchange="peFilaSet(${i},'tipoHora',this.value)" aria-label="Tipo de hora">
      ${opciones(TIPOS_HORA.map(x => ({ v: x.id, t: x.nombre })), f.tipoHora || 'comun')}</select></td>
    <td class="num"><input type="number" step="10" min="0" value="${f.pu || 0}" oninput="peFilaSet(${i},'pu',this.value)" aria-label="Precio por hora" style="width:84px;text-align:right"></td>
    <td class="num solo-compu"><input type="number" step="10" min="0" value="${f.descuento || 0}" oninput="peFilaSet(${i},'descuento',this.value)" aria-label="Descuento" style="width:78px;text-align:right"></td>
    <td class="num"><b class="pe-t">${pesos(totalFila(f))}</b></td>
    <td class="acc"><button class="icon-btn chico" onclick="peQuitar(${i})" aria-label="Quitar">${ico('x')}</button></td>
  </tr>`;
}

/* ---------- Cambios en el borrador ---------- */
function peSet(k, v){ pe[k] = v; if (k === 'estado') refrescarModal(); }
function peCambiarFecha(v){
  pe.fecha = v || hoy();
  const def = tipoHoraPorFecha(pe.fecha);
  pe.filas.forEach(f => { if (f.tipoHora !== 'extra') f.tipoHora = def; f.pu = precioHora(pe.clienteId, pe.fecha, f.tipoHora); });
  refrescarModal();
}
function peCambiarCliente(v){
  pe.clienteId = v;
  const c = clienteDe(v);
  pe.contacto = c && c.contactos && c.contactos[0] ? c.contactos[0].nombre : '';
  pe.area = '';
  pe.filas.forEach(f => f.pu = precioHora(v, pe.fecha, f.tipoHora || 'comun'));
  refrescarModal();
}
function peFilaSet(i, k, v){
  const f = pe.filas[i]; if (!f) return;
  if (k === 'pu' || k === 'descuento' || k === 'horas') f[k] = v === '' ? (k === 'horas' ? '' : 0) : Number(v);
  else f[k] = v;
  if (k === 'tipoHora') f.pu = precioHora(pe.clienteId, pe.fecha, v);
  if (k === 'entrada' || k === 'salida' || k === 'tipoHora') return peRedibujarFilas();
  peActualizarTotales(i);
}
function peAgregar(){
  const usados = pe.filas.map(f => f.funcId);
  const libre = funcActivos().find(f => !usados.includes(f.id));
  pe.filas.push(nuevaFila(libre ? libre.id : '', pe.fecha, pe.clienteId));
  peRedibujarFilas();
}
function peQuitar(i){ pe.filas.splice(i, 1); peRedibujarFilas(); }
function peCuadrilla(id){
  const c = Store.obtener('cuadrillas', id); if (!c) return;
  if (c.clienteId && !pe.filas.length){
    pe.clienteId = c.clienteId; pe.contacto = c.contacto || pe.contacto;
    pe.area = c.area || pe.area; pe.tipoId = pe.tipoId || c.tipoId || '';
  }
  const usados = pe.filas.map(f => f.funcId);
  (c.funcIds || []).forEach(fid => { if (!usados.includes(fid)) pe.filas.push(nuevaFila(fid, pe.fecha, pe.clienteId)); });
  refrescarModal();
  aviso(`Cuadrilla «${c.nombre}» cargada`);
}
function peJornadaTodos(i){
  const j = JORNADAS_RAPIDAS[Number(i)]; if (!j) return;
  pe.filas.forEach(f => { f.entrada = j.e; f.salida = j.s; f.horas = ''; });
  peRedibujarFilas();
}
function peRedibujarFilas(){
  const c = $('#pe-filas'); if (!c) return refrescarModal();
  c.innerHTML = peTabla(); pintarIconos(c);
  peActualizarTotales();
}
function peActualizarTotales(i){

    if (tr){ const b = tr.querySelector('.pe-t'); if (b) b.textContent = pesos(totalFila(pe.filas[i])); }
  }

  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set('#pe-horas', fHorasN(t.horas)); set('#pe-sub', pesos(t.subtotal));
  set('#pe-iva', pesos(t.iva)); set('#pe-tot', pesos(t.total));
  const d = $('#pe-detalle'); if (d) d.innerHTML = peDetalleHoras(t);
}

/* ---------- Guardar ---------- */
function peGuardar(){
  if (!pe.clienteId) return marcarError('clienteId', 'Elegí el cliente.');
  if (!pe.actividad.trim()) return marcarError('actividad', 'Escribí qué se hizo: es lo que va en el reporte del cliente.');
  if (!pe.filas.length) return aviso('Agregá al menos un funcionario con sus horas', { tipo: 'error' });
  const sinFunc = pe.filas.findIndex(f => !f.funcId);
  if (sinFunc >= 0) return aviso('Hay una fila sin funcionario elegido', { tipo: 'error' });
  const sinHoras = pe.filas.findIndex(f => !horasFila(f));
  if (sinHoras >= 0) return aviso(`${nombreFunc(pe.filas[sinHoras].funcId)} quedó sin horas`, { tipo: 'error' });
  const repe = pe.filas.map(f => f.funcId).filter((x, i, a) => a.indexOf(x) !== i);
  if (repe.length) aviso(`${nombreFunc(repe[0])} está dos veces en este parte`, { tipo: 'alerta' });

  const datos = { fecha: pe.fecha, clienteId: pe.clienteId, contacto: pe.contacto, area: pe.area,
    tipoId: pe.tipoId, actividad: pe.actividad.trim(), ot: pe.ot.trim(), estado: pe.estado,
    obs: pe.obs, filas: pe.filas };
  if (peNuevo){
    const n = Store.crear('partes', datos, `Nuevo parte del ${fFecha(pe.fecha)}: ${pe.actividad}`);
    aviso('Parte guardado', { deshacer: () => { Store.borrar('partes', n.id); pintarVista(); } });
  } else {
    Store.editar('partes', pe.id, datos, `Corrigió el parte del ${fFecha(pe.fecha)}`);
    aviso('Parte actualizado');
  }
  cerrarModal();
}
function peAvanzar(){
  const sig = proximoEstado(pe.estado);
  pe.estado = sig;
  if (!peNuevo){
    const datos = { ...pe }; delete datos.id;
    Store.editar('partes', pe.id, datos);
    cambiarEstadoParte(pe.id, sig);
    aviso(`Parte marcado como «${estadoDe(sig).nombre}»`);
  }
  refrescarModal();
}
async function peBorrar(){
  const ok = await confirmar({ titulo: '¿Borrar este parte?',
    texto: `Se va a borrar el parte del <b>${fFecha(pe.fecha)}</b> con sus ${pe.filas.length} fila(s) de horas. No se puede deshacer después de cerrar.`,
    si: 'Sí, borrar', peligro: true });
  if (!ok) return;
  const copia = JSON.parse(JSON.stringify(Store.obtener('partes', pe.id)));
  Store.borrar('partes', pe.id, `Borró el parte del ${fFecha(pe.fecha)}`);
  cerrarModal();
  aviso('Parte borrado', { tipo: 'alerta', deshacer: () => { Store.crear('partes', copia); pintarVista(); } });
}

/* ---------- Copiar a otro día ---------- */
function peCopiar(){
  abrirModal(() => ({
    titulo: 'Copiar el parte a otro día', ancho: 'sm',
    cuerpo: `<p class="suave">Se copia el trabajo con las mismas personas y las mismas horas. Si el día nuevo cae
      en ${DIAS[cfg().diaDescanso]}, las horas se marcan solas como «día de descanso».</p>
      <div id="pc-caja">${campo('Nueva fecha', `<input type="date" name="f" value="${sumarDias(pe.fecha, 1)}" autofocus>`)}
      ${campo('¿Cuántos días seguidos?', `<select name="n">${opciones([1, 2, 3, 4, 5, 6].map(n => ({ v: n, t: n === 1 ? 'Solo ese día' : n + ' días seguidos' })), 1)}</select>`)}</div>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button>
          <button class="btn btn-azul" onclick="peCopiarConfirmar()">${ico('copiar')} Copiar</button>`,
  }));
}
function peCopiarConfirmar(){
  const d = leerForm('#pc-caja');
  if (!d.f) return marcarError('f', 'Elegí la fecha.');
  const n = Number(d.n) || 1, hechos = [];
  for (let i = 0; i < n; i++){
    const f = sumarDias(d.f, i);
    if (esDiaDescanso(f) && n > 1) continue;      // al copiar varios días seguidos, se saltea el descanso
    hechos.push(copiarParte(pe.id, f));
  }
  cerrarModal(); cerrarModal();
  aviso(`${hechos.length} parte(s) creados`, { deshacer: () => { hechos.forEach(h => Store.borrar('partes', h.id)); pintarVista(); } });
  pintarVista();
}
function peCopiarA(fecha){
  const n = copiarParte(pe.id, fecha);
  cerrarModal();
  aviso(`Parte copiado al ${fFecha(fecha)}`, { deshacer: () => { Store.borrar('partes', n.id); pintarVista(); } });
  pintarVista();
}

function guardarTarifa(cliId){
  const d = leerForm('#et-caja');
  if (!d.desde) return marcarError('desde', 'Elegí desde cuándo vale.');
  const c = clienteDe(cliId);
  Store.editar('clientes', cliId, { tarifas: [...(c.tarifas || []), { id: nuevoId('tar'), desde: d.desde,
    comun: Number(d.comun) || 0, extra: Number(d.extra) || 0, descanso: Number(d.descanso) || Number(d.extra) || 0 }] },
    `Nueva tarifa de ${c.nombre} desde ${fFecha(d.desde)}`);
  cerrarModal(); refrescarModal(); aviso('Tarifa guardada');
}
async function borrarTarifa(cliId, tarId){
  if (!await confirmar({ titulo: '¿Quitar esta tarifa?', texto: 'Los partes ya cargados no cambian.', si: 'Quitar', peligro: true })) return;
  const c = clienteDe(cliId);
  Store.editar('clientes', cliId, { tarifas: c.tarifas.filter(t => t.id !== tarId) });
  refrescarModal(); aviso('Tarifa quitada');
}

let fnMes = '';
function vistaFuncionarios(sub){
  if (!fnMes) fnMes = mesDe(hoy());
  const tab = sub || 'horas';
  subSeccion.funcionarios = tab;
  const d = fnMes + '-01', h = fnMes + '-31';
  return `
  ${pestanas([
    { id: 'horas', t: 'Horas del mes' },
    { id: 'control', t: 'Control con el reloj', n: sinImputarDe(d, h).conDif || '' },
    { id: 'adelantos', t: 'Adelantos' },
    { id: 'fichas', t: 'Fichas', n: funcActivos().length },
  ], tab, 'fnIr')}
  ${tab === 'horas' ? fnHoras() : tab === 'control' ? fnControl() : tab === 'adelantos' ? fnAdelantos() : fnFichas()}`;
}
function fnIr(t){ irA('funcionarios', t); }
function fnCambiarMes(d){ fnMes = mesDe(sumarMeses(fnMes + '-01', d)); pintarVista(); }
function barraMes(extra){
  return `<div class="barra-filtros">
    <div class="filtros-izq"><div class="periodo">
      <button class="icon-btn borde" onclick="fnCambiarMes(-1)" aria-label="Mes anterior">${ico('izq')}</button>
      <b>${fMes(fnMes)}</b>
      <button class="icon-btn borde" onclick="fnCambiarMes(1)" aria-label="Mes siguiente">${ico('der')}</button>
    </div></div>
    <div class="filtros-der">${extra || ''}</div>
  </div>`;
}

/* ---------- Horas del mes por funcionario ---------- */
function fnHoras(){
  const d = fnMes + '-01', h = fnMes + '-31';
  const datos = funcActivos().map(f => {
    const hh = horasFuncionario(f.id, d, h);
    const rel = horasReloj(f.id, d, h);
    const ctl = controlHoras(f.id, d, h);
    return { f, hh, rel, ctl, ade: totalAdelantos(f.id, d, h) };
  }).sort((a, b) => b.hh.total - a.hh.total);
  const tot = { comun: sumar(datos, x => x.hh.comun), extra: sumar(datos, x => x.hh.extra), descanso: sumar(datos, x => x.hh.descanso),
    total: sumar(datos, x => x.hh.total), reloj: sumar(datos, x => x.rel.total), ade: sumar(datos, x => x.ade), fact: sumar(datos, x => x.hh.facturado) };
  return `${barraMes(`<button class="btn btn-linea" onclick="exportarHoras()">${ico('excel')} Exportar</button>`)}
  <div class="kpis">
    <div class="kpi"><span class="kpi-t">${ico('reloj')} Horas imputadas</span><span class="kpi-v">${fHorasN(tot.total)}</span>
      <small>${fHorasN(tot.comun)} comunes · ${fHorasN(tot.extra + tot.descanso)} con recargo</small></div>
    <div class="kpi"><span class="kpi-t">${ico('importar')} Marcadas en el reloj</span><span class="kpi-v">${fHorasN(tot.reloj)}</span>
      <small>${Math.abs(tot.reloj - tot.total) <= 0.5 ? 'Coincide con los partes' : `<span class="txt-critico">${fHorasN(Math.abs(tot.reloj - tot.total))} de diferencia</span>`}</small></div>
    <div class="kpi"><span class="kpi-t">${ico('plata')} Facturado por esas horas</span><span class="kpi-v">${pesos(tot.fact)}</span><small>sin IVA</small></div>
    <div class="kpi"><span class="kpi-t">${ico('plata')} Adelantos del mes</span><span class="kpi-v">${pesos(tot.ade)}</span>
      <small>${Store.listar('adelantos', a => mesDe(a.fecha) === fnMes).length} movimiento(s)</small></div>
  </div>
  <div class="panel sin-pad"><div class="tabla-resp"><table class="tabla clicable">
    <thead><tr>
      <th>Funcionario</th><th class="num">Común</th><th class="num">Extra</th><th class="num">Descanso</th>
      <th class="num">Total</th><th class="num">Reloj</th><th class="num">Dif.</th>
      <th class="num solo-compu">Días</th><th class="num solo-compu">Adelantos</th><th></th>
    </tr></thead>
    <tbody>${datos.map(x => `<tr onclick="fichaFuncionario('${x.f.id}')">
      <td><span style="display:flex;align-items:center;gap:9px">
        <span class="avatar chico" style="--c:${x.f.color}">${iniciales(x.f.nombre)}</span>
        <span><b>${esc(x.f.nombre)}</b><small>${esc(x.f.especialidad)}</small></span></span></td>
      <td class="num">${fHorasN(x.hh.comun)}</td>
      <td class="num">${x.hh.extra ? fHorasN(x.hh.extra) : '—'}</td>
      <td class="num">${x.hh.descanso ? fHorasN(x.hh.descanso) : '—'}</td>
      <td class="num"><b>${fHorasN(x.hh.total)}</b></td>
      <td class="num">${x.rel.total ? fHorasN(x.rel.total) : '—'}</td>
      <td class="num">${x.ctl.dif ? `<b class="${Math.abs(x.ctl.dif) > cfg().toleranciaDif ? 'txt-critico' : 'suave'}">${x.ctl.dif > 0 ? '+' : ''}${fHorasN(x.ctl.dif)}</b>` : '<span class="txt-ok">OK</span>'}</td>
      <td class="num solo-compu">${x.hh.dias}</td>
      <td class="num solo-compu">${x.ade ? pesos(x.ade) : '—'}</td>
      <td class="acc">${ico('flecha')}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total del mes</td>
      <td class="num">${fHorasN(tot.comun)}</td><td class="num">${fHorasN(tot.extra)}</td><td class="num">${fHorasN(tot.descanso)}</td>
      <td class="num">${fHorasN(tot.total)}</td><td class="num">${fHorasN(tot.reloj)}</td>
      <td class="num">${fHorasN(tot.reloj - tot.total)}</td><td class="solo-compu"></td>
      <td class="num solo-compu">${pesos(tot.ade)}</td><td></td></tr></tfoot>
  </table></div></div>`;
}

/* ---------- Control de horas: reloj contra partes, día por día ---------- */
function fnControl(){
  const d = fnMes + '-01', h = fnMes + '-31';
  const si = sinImputarDe(d, h);
  const datos = funcActivos().map(f => ({ f, c: controlHoras(f.id, d, h) })).filter(x => x.c.dias.length);
  return `${barraMes(`<button class="btn btn-linea" onclick="importarReloj()">${ico('importar')} Importar reloj</button>
    <button class="btn btn-linea" onclick="cargarMarca()">${ico('mas')} Marca a mano</button>`)}
  <div class="nota-aviso ${si.horas ? 'critico' : 'ok'}">${ico(si.horas ? 'alerta' : 'check')}
    <div>${si.horas
      ? `<b>${fHoras(si.horas)} marcadas en el reloj que no están puestas en ningún trabajo.</b>
         Al precio del cliente son <b>${pesos(si.venta)}</b> que no se facturaron.
         Hay ${si.conDif} día(s) del mes con diferencia. ${AYUDAS.diferencia}`
      : `<b>Todo cuadra.</b> Las horas del reloj coinciden con las que están puestas en los trabajos.`}</div></div>
  ${datos.length ? datos.map(x => fnControlFunc(x)).join('') : vacio('No hay marcas ni horas cargadas en este mes.')}`;
}
function fnControlFunc({ f, c }){
  const malos = c.dias.filter(d => !d.ok);
  return `<div class="panel">
    <div class="panel-cab">
      <h2><span class="avatar chico" style="--c:${f.color}">${iniciales(f.nombre)}</span> ${esc(f.nombre)}</h2>
      ${malos.length ? `<span class="etq critico">${malos.length} día(s) con diferencia</span>` : `<span class="etq ok">${ico('check')} Al día</span>`}
      <span class="suave chico">${fHoras(c.imputadas)} en trabajos · ${fHoras(c.marcadas)} en el reloj</span>
    </div>
    <div class="calendario">${c.dias.map(d => `
      <button class="cal-dia ${d.ok ? 'ok' : 'mal'} ${d.soloReloj ? 'solo-reloj' : ''}" onclick="fnDia('${f.id}','${d.fecha}')"
        title="${fFecha(d.fecha)}: ${fHoras(d.imputadas)} en trabajos, ${fHoras(d.marcadas)} en el reloj">
        <b>${aFecha(d.fecha).getDate()}</b>
        <span>${DIAS_C[diaSemana(d.fecha)]}</span>
        <u>${fHorasN(d.imputadas)}</u>
        ${!d.ok ? `<i>${d.dif > 0 ? '+' : ''}${fHorasN(d.dif)}</i>` : ''}
      </button>`).join('')}</div>
    ${malos.length ? `<div class="chico suave" style="margin-top:10px">
      Tocá un día para ver qué trabajos tiene y qué marcó el reloj.</div>` : ''}
  </div>`;
}
function fnDia(funcId, fecha){
  const f = funcDe(funcId);
  const filas = filasEntre(fecha, fecha, x => x.funcId === funcId);
  const marcas = marcasEntre(funcId, fecha, fecha);
  const imp = sumar(filas, x => x.horasCalc), mar = sumar(marcas, x => Number(x.horas) || 0);
  const dif = redondear(mar - imp);
  abrirModal(() => ({
    ancho: 'md', titulo: `${esc(f.nombre)} · ${fDiaCorto(fecha)}`,
    sub: Math.abs(dif) <= cfg().toleranciaDif ? 'Las horas cuadran' : `Diferencia de ${fHoras(Math.abs(dif))}`,
    cuerpo: `
      <div class="kpis k3">
        <div class="kpi chico"><span class="kpi-t">En trabajos</span><span class="kpi-v">${fHorasN(imp)}</span><small>${filas.length} fila(s)</small></div>
        <div class="kpi chico"><span class="kpi-t">En el reloj</span><span class="kpi-v">${fHorasN(mar)}</span>
          <small>${marcas.map(m => `${fHora(m.entrada)} a ${fHora(m.salida)}`).join(' · ') || 'sin marca'}</small></div>
        <div class="kpi chico ${Math.abs(dif) > cfg().toleranciaDif ? 'k-critico' : 'k-ok'}">
          <span class="kpi-t">Diferencia</span><span class="kpi-v">${dif > 0 ? '+' : ''}${fHorasN(dif)}</span>
          <small>${dif > 0 ? 'sin imputar' : (dif < 0 ? 'de más en los partes' : 'cuadra')}</small></div>
      </div>
      <h3 class="sub-h">Trabajos de ese día</h3>
      ${filas.length ? `<ul class="lista-simple">${filas.map(x => `<li>
        <span><b>${esc(x.actividad)}</b><small>${esc(nombreCliente(x.clienteId))} · ${esc(x.area || '')} · ${fHora(x.entrada)} a ${fHora(x.salida)}</small></span>
        <b>${fHoras(x.horasCalc)}</b>
        <span class="acc"><button class="icon-btn chico" onclick="cerrarModal(); fichaParte('${x.parte.id}')" aria-label="Abrir">${ico('flecha')}</button></span></li>`).join('')}</ul>`
        : `<div class="nota-aviso critico">${ico('alerta')}<div>Este día el reloj marcó <b>${fHoras(mar)}</b> y no hay ningún trabajo cargado.
            Son horas que se pagan y no se le cobran a nadie.</div></div>`}
      ${dif > cfg().toleranciaDif ? `<div class="botonera">
        <button class="btn btn-naranja" onclick="cerrarModal(); nuevoParte('${fecha}')">${ico('mas')} Cargar el trabajo que falta</button></div>` : ''}`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cerrar</button>`,
  }));
}

/* ---------- Adelantos ---------- */

  const mes = l.filter(a => mesDe(a.fecha) === fnMes);

  <div class="kpis k3">

  <div class="panel sin-pad"><div class="tabla-resp"><table class="tabla">
    <thead><tr><th>Fecha</th><th>Funcionario</th><th class="num">Monto</th><th class="solo-compu">Nota</th><th>Descontado</th><th></th></tr></thead>
    <tbody>${l.length ? l.map(a => `<tr>
      <td>${fFecha(a.fecha)}<small>${DIAS_C[diaSemana(a.fecha)]}</small></td>
      <td><span style="display:flex;align-items:center;gap:8px"><span class="avatar mini" style="--c:${colorFunc(a.funcId)}">${iniciales(nombreFunc(a.funcId))}</span>${esc(nombreFunc(a.funcId))}</span></td>
      <td class="num"><b>${pesos(a.monto)}</b></td>
      <td class="solo-compu suave">${esc(a.nota || '—')}</td>
      <td><button class="chip ${a.descontado ? 'on' : ''}" onclick="adeToggle('${a.id}')">${a.descontado ? ico('check') + ' Sí' : 'Pendiente'}</button></td>
      <td class="acc">
        <button class="icon-btn chico" onclick="editarAdelanto('${a.id}')" aria-label="Editar">${ico('lapiz')}</button>
        <button class="icon-btn chico" onclick="borrarAdelanto('${a.id}')" aria-label="Borrar">${ico('basura')}</button></td></tr>`).join('')
      : `<tr><td colspan="6">${vacio('Todavía no hay adelantos cargados.')}</td></tr>`}</tbody>
  </table></div></div>`;
}
function adeToggle(id){
  const a = Store.obtener('adelantos', id);
  Store.editar('adelantos', id, { descontado: !a.descontado }, `Adelanto de ${nombreFunc(a.funcId)}: ${!a.descontado ? 'descontado' : 'pendiente'}`);
  pintarVista();
}
function editarAdelanto(id){
  const a = id ? Store.obtener('adelantos', id) : null;
  abrirModal(() => ({
    ancho: 'sm', titulo: a ? 'Editar adelanto' : 'Registrar adelanto',
    cuerpo: `<div id="ea-caja" class="grilla-campos">
      ${campo('Funcionario', `<select name="funcId">${opciones(funcActivos().map(f => ({ v: f.id, t: f.nombre })), a ? a.funcId : '', '— elegir —')}</select>`, 'ancho')}
      ${campo('Fecha', `<input type="date" name="fecha" value="${a ? a.fecha : hoy()}">`)}
      ${campo('Monto', `<input type="number" name="monto" min="0" step="100" value="${a ? a.monto : ''}" autofocus>`)}
      ${campo('Nota', `<input name="nota" value="${esc(a ? a.nota : '')}" placeholder="Opcional">`, 'ancho')}
      <label class="check-inline ancho"><input type="checkbox" name="descontado" ${a && a.descontado ? 'checked' : ''}> Ya se descontó</label>
    </div>`,
    pie: `<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-azul" onclick="guardarAdelanto(${a ? `'${a.id}'` : 'null'})">${ico('check')} Guardar</button>`,
  }));
}
function guardarAdelanto(id){
  const d = leerForm('#ea-caja');
  if (!d.funcId) return marcarError('funcId', 'Elegí el funcionario.');
  if (!d.monto) return marcarError('monto', 'Poné el monto.');
  if (id) Store.editar('adelantos', id, d, `Editó un adelanto de ${nombreFunc(d.funcId)}`);
  else Store.crear('adelantos', d, `Adelanto de ${pesos(d.monto)} a ${nombreFunc(d.funcId)}`);
  cerrarModal(); aviso('Adelanto guardado');
}
async function borrarAdelanto(id){
  const a = Store.obtener('adelantos', id);
  if (!await confirmar({ titulo: '¿Borrar el adelanto?', texto: `${pesos(a.monto)} de ${esc(nombreFunc(a.funcId))} del ${fFecha(a.fecha)}.`, si: 'Borrar', peligro: true })) return;
  const copia = { ...a };
  Store.borrar('adelantos', id, `Borró un adelanto de ${nombreFunc(a.funcId)}`);
  pintarVista();
  aviso('Adelanto borrado', { tipo: 'alerta', deshacer: () => { Store.crear('adelantos', copia); pintarVista(); } });
}

/* ---------- Exportar las horas del mes ---------- */
function exportarHoras(){
  const d = fnMes + '-01', h = fnMes + '-31';
  const filas = funcActivos().map(f => ({ f, hh: horasFuncionario(f.id, d, h), rel: horasReloj(f.id, d, h), ctl: controlHoras(f.id, d, h), ade: totalAdelantos(f.id, d, h) }));
  exportarExcel(`Horas ${fMes(fnMes)}`, [
    { t: 'Funcionario', v: x => x.f.nombre },
    { t: 'ID reloj', v: x => x.f.idReloj },
    { t: 'Especialidad', v: x => x.f.especialidad },
    { t: 'Horas comunes', v: x => x.hh.comun },
    { t: 'Horas extra', v: x => x.hh.extra },
    { t: 'Horas día de descanso', v: x => x.hh.descanso },
    { t: 'Total imputado', v: x => x.hh.total },
    { t: 'Marcado en el reloj', v: x => x.rel.total },
    { t: 'Diferencia', v: x => x.ctl.dif },
    { t: 'Días trabajados', v: x => x.hh.dias },
    { t: 'Adelantos', v: x => x.ade },
    { t: 'Facturado por sus horas', v: x => x.hh.facturado },
  ], filas);
}
