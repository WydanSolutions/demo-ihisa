/* =====================================================================
   COBROS: lo que se le facturó a cada cliente, qué está cobrado,
   qué está pendiente y qué se venció
   ===================================================================== */
const filtroCo = { estado: '', clienteId: '', anio: '' };

function vistaCobros(){
  const l = cobrosDe(c =>
    (!filtroCo.estado || estadoCobro(c) === filtroCo.estado) &&
    (!filtroCo.clienteId || c.clienteId === filtroCo.clienteId) &&
    (!filtroCo.anio || c.fecha.slice(0, 4) === filtroCo.anio));
  const todos = cobrosDe();
  const anios = [...new Set(todos.map(c => c.fecha.slice(0, 4)))].sort().reverse();
  const cobradoMes = sumar(todos.filter(c => estadoCobro(c) === 'cobrado' && mesDe(c.fechaCobro || c.fecha) === mesDe(hoy())), c => c.total);
  const facturadoMes = sumar(todos.filter(c => mesDe(c.fecha) === mesDe(hoy())), c => c.total);
  return `
  <div class="kpis">
    <div class="kpi"><span class="kpi-t">${ico('plata')} Facturado en ${fMesCorto(mesDe(hoy()))}</span>
      <span class="kpi-v">${pesos(facturadoMes)}</span><small>IVA incluido</small></div>
    <div class="kpi k-ok"><span class="kpi-t">${ico('check')} Cobrado este mes</span>
      <span class="kpi-v">${pesos(cobradoMes)}</span><small>plata que entró</small></div>
    <div class="kpi k-alerta"><span class="kpi-t">${ico('reloj')} Pendiente de cobro</span>
      <span class="kpi-v">${pesos(porCobrar())}</span><small>${todos.filter(c => estadoCobro(c) === 'pendiente').length} documento(s)</small></div>
    <div class="kpi ${vencido() ? 'k-critico' : 'k-ok'}"><span class="kpi-t">${ico('alerta')} Vencido</span>
      <span class="kpi-v">${pesos(vencido())}</span><small>${todos.filter(c => estadoCobro(c) === 'vencido').length} documento(s)</small></div>
  </div>

  <div class="barra-filtros">
    <div class="filtros-izq">
      <div class="chips">
        <button class="chip ${!filtroCo.estado ? 'on' : ''}" onclick="coFiltro('estado','')">Todos <i>${todos.length}</i></button>
        ${ESTADOS_COBRO.map(e => { const n = todos.filter(c => estadoCobro(c) === e.id).length;
          return `<button class="chip ${filtroCo.estado === e.id ? 'on' : ''}" onclick="coFiltro('estado','${e.id}')">${e.nombre} <i>${n}</i></button>`; }).join('')}
      </div>
    </div>
    <div class="filtros-der">
      <select onchange="coFiltro('clienteId',this.value)" aria-label="Cliente">
        ${opciones(Store.listar('clientes').map(c => ({ v: c.id, t: c.nombre })), filtroCo.clienteId, 'Todos los clientes')}</select>
      <select onchange="coFiltro('anio',this.value)" aria-label="Año" class="solo-compu">
        ${opciones(anios, filtroCo.anio, 'Todos los años')}</select>
      ${masOpciones([
        { ico: 'mas', t: 'Registrar un cobro a mano', js: 'editarCobro()' },
        { ico: 'excel', t: 'Exportar los cobros', js: 'exportarCobros()' },
      ])}
    </div>
  </div>

  <div class="panel sin-pad"><div class="tabla-resp"><table class="tabla clicable">
    <thead><tr><th>Fecha</th><th>Cliente / concepto</th><th class="num solo-compu">Subtotal</th>
      <th class="num">Total</th><th>Vence</th><th>Estado</th><th></th></tr></thead>
    <tbody>${l.length ? l.map(c => {
      const e = estadoCobro(c);
      return `<tr onclick="fichaCobro('${c.id}')">
        <td>${fCorta(c.fecha)}<small>${esc(c.factura || '')}</small></td>
        <td><b>${esc(nombreCliente(c.clienteId))}</b><small>${esc(c.concepto)}</small></td>
        <td class="num solo-compu">${pesos(c.subtotal)}</td>
        <td class="num"><b>${pesos(c.total)}</b></td>

function coFiltro(k, v){ filtroCo[k] = v; pintarVista(); }

/* ---------- Gráfico de facturación por mes ---------- */
function graficoMeses(){
  const meses = [];
  for (let i = 5; i >= 0; i--) meses.push(mesDe(sumarMeses(hoy(), -i)));
  const datos = meses.map(m => ({ m, t: sumar(cobrosDe(c => mesDe(c.fecha) === m), c => c.total),
    c: sumar(cobrosDe(c => estadoCobro(c) === 'cobrado' && mesDe(c.fechaCobro || c.fecha) === m), c => c.total) }));
  const max = Math.max(...datos.map(d => Math.max(d.t, d.c))) || 1;
  if (!max) return vacio('Todavía no hay cobros cargados.');
  return `<div class="grafico">${datos.map(d => `
    <div class="g-col ${d.m === mesDe(hoy()) ? 'actual' : ''}" title="${fMes(d.m)}: facturado ${pesos(d.t)} · cobrado ${pesos(d.c)}">
      <span class="g-total">${Math.round(d.t / 1000)}k</span>
      <div class="g-barra" style="height:${(d.t / max * 100).toFixed(1)}%"><i class="g-com" style="flex:1"></i></div>
      <span class="g-pie">${fMesCorto(d.m)}</span>
    </div>`).join('')}</div>
  <div class="leyenda"><span><i class="l-com"></i>Facturado (IVA incluido)</span></div>`;
}

function guardarCobrado(id){

}
function editarCobro(id){
  const c = id ? Store.obtener('cobros', id) : null;

  abrirModal(() => ({
    ancho: 'md', titulo: c ? 'Editar el cobro' : 'Registrar un cobro',

function guardarCobro(id){
  const d = leerForm('#eco2-caja');
  if (!d.concepto) return marcarError('concepto', 'Escribí el concepto.');
  if (!d.subtotal) return marcarError('subtotal', 'Poné el subtotal.');

  const datos = { ...d, iva, total: redondear(d.subtotal + iva), estado: id ? Store.obtener('cobros', id).estado : 'pendiente',
    periodoDesde: d.fecha, periodoHasta: d.fecha, partes: id ? Store.obtener('cobros', id).partes : [] };

  else Store.crear('cobros', datos, `Nuevo cobro de ${nombreCliente(d.clienteId)} por ${pesos(datos.total)}`);

async function borrarCobro(id){
  const c = Store.obtener('cobros', id);
  if (!await confirmar({ titulo: '¿Borrar el cobro?', texto: `${pesos(c.total)} de ${esc(nombreCliente(c.clienteId))}. Los partes no se tocan.`, si: 'Borrar', peligro: true })) return;
  const copia = JSON.parse(JSON.stringify(c));
  Store.borrar('cobros', id, 'Borró un cobro');

  aviso('Cobro borrado', { tipo: 'alerta', deshacer: () => { Store.crear('cobros', copia); pintarVista(); } });

      ${ESTADOS.map(e => `<button class="chip ${rep.incluir.includes(e.id) ? 'on' : ''}" onclick="repIncluir('${e.id}')">${e.corto}</button>`).join('')}

function repTipo(t){ rep.tipo = t; pintarVista(); }
function repSet(k, v){ rep[k] = v; pintarVista(); }
function repIncluir(e){
  rep.incluir = rep.incluir.includes(e) ? rep.incluir.filter(x => x !== e) : [...rep.incluir, e];
  pintarVista();
}
function repPeriodo(tipo, d){
  if (tipo === 'semana'){ rep.desde = inicioSemana(sumarDias(hoy(), d * 7)); rep.hasta = sumarDias(rep.desde, 6); }
  else { const m = mesDe(sumarMeses(hoy(), d)); rep.desde = m + '-01'; rep.hasta = iso(new Date(+m.slice(0, 4), +m.slice(5, 7), 0)); }
  pintarVista();
}
function repCliente(id){ rep.clienteId = id; rep.contacto = ''; rep.tipo = 'cliente'; pintarVista(); }
function repDeLoPendiente(){
  const term = Store.listar('partes', p => p.estado === 'terminado').sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  if (!term.length) return;
  rep.clienteId = term[0].clienteId; rep.contacto = term[0].contacto;
  rep.desde = term[0].fecha; rep.hasta = term[term.length - 1].fecha;
  rep.incluir = ['terminado']; rep.tipo = 'cliente';
  pintarVista();
}

/* ---------- Las filas que entran en el reporte ---------- */
function repFilas(){
  return filasEntre(rep.desde, rep.hasta, f =>
    f.clienteId === rep.clienteId &&
    (!rep.contacto || f.contacto === rep.contacto) &&
    rep.incluir.includes(f.estado));
}
function repPartes(){
  return partesEntre(rep.desde, rep.hasta, p => p.clienteId === rep.clienteId &&
    (!rep.contacto || p.contacto === rep.contacto) && rep.incluir.includes(p.estado));
}

/* ---------- La vista previa (y lo que se imprime) ---------- */
function repHTML(){
  if (rep.tipo === 'tareas') return repTareasHTML();
  if (rep.tipo === 'horas') return repHorasHTML();
  return repClienteHTML();
}

  return `<div class="a4">

      <tbody>${filas.map(f => {

/* ===== js/17-exportar.js ===== */
/* =====================================================================
   EXPORTAR A EXCEL Y A PDF
   Para que el archivo sea un Excel de verdad (.xlsx) y un PDF A4 se usan
   dos bibliotecas que se bajan solo cuando se aprieta el botón (SheetJS y
   jsPDF). Si la página se abre sin internet, el Excel sale como .csv —que
   Excel abre igual— y el PDF sale por la ventana de impresión.
   ===================================================================== */
const CDN = {
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  autotable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
};
const _scripts = {};
function cargarScript(url){
  if (_scripts[url]) return _scripts[url];
  _scripts[url] = new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = url; s.onload = () => ok(true); s.onerror = () => mal(new Error('sin internet'));
    document.head.appendChild(s);
  });
  return _scripts[url];
}
const nombreArchivo = n => `IHISA - ${n} - ${hoy()}`;

/* ---------- Guardar un archivo ---------- */
function bajar(blob, nombre){
  avisarSiEnMarco('bajar el archivo');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ---------- Excel genérico (una tabla) ---------- */
async function exportarExcel(nombre, columnas, filas){
  const datos = [columnas.map(c => c.t)].concat(filas.map(f => columnas.map(c => {
    const v = c.v(f); return v === undefined || v === null ? '' : v;
  })));
  try {
    await cargarScript(CDN.xlsx);
    const hoja = XLSX.utils.aoa_to_sheet(datos);
    hoja['!cols'] = columnas.map(c => ({ wch: Math.max(10, Math.min(42, c.t.length + 6)) }));
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, nombre.slice(0, 28));
    avisarSiEnMarco('bajar la planilla');
    XLSX.writeFile(libro, nombreArchivo(nombre) + '.xlsx');
    aviso('Planilla descargada (.xlsx)');
  } catch (e) {
    exportarCSV(nombre, datos);
  }
}
function exportarCSV(nombre, datos){
  const celda = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const texto = datos.map(f => f.map(celda).join(';')).join('\r\n');
  bajar(new Blob(['﻿' + texto], { type: 'text/csv;charset=utf-8' }), nombreArchivo(nombre) + '.csv');
  aviso('Planilla descargada (.csv, se abre con Excel)', { tipo: 'alerta' });
}

/* =====================================================================
   EL REPORTE PARA EL CLIENTE EN EXCEL
   Mismo formato que la planilla: encabezado, tabla de horas, subtotal,
   IVA, total y el cuadro por centro de costo. Si el período pasa de una
   semana, va una hoja por semana más una hoja con el total.
   ===================================================================== */
async function repExcel(){
  if (rep.tipo === 'tareas') return repExcelTareas();
  if (rep.tipo === 'horas') return repExcelHoras();
  const filas = repFilas();
  if (!filas.length) return aviso('No hay nada para exportar con estos filtros', { tipo: 'error' });
  const c = clienteDe(rep.clienteId);
  try {
    await cargarScript(CDN.xlsx);
    const libro = XLSX.utils.book_new();
    /* una hoja por semana */
    const semanas = {};
    filas.forEach(f => { const k = inicioSemana(f.fecha); (semanas[k] = semanas[k] || []).push(f); });
    const claves = Object.keys(semanas).sort();
    claves.forEach(k => {
      const nombre = claves.length > 1 ? `${fCorta(k).replace('/', '-')} al ${fCorta(sumarDias(k, 6)).replace('/', '-')}` : 'Reporte';
      XLSX.utils.book_append_sheet(libro, hojaReporte(c, semanas[k], k, sumarDias(k, 6)), nombre.slice(0, 28));
    });
    if (claves.length > 1)
      XLSX.utils.book_append_sheet(libro, hojaReporte(c, filas, rep.desde, rep.hasta), 'TOTAL');
    avisarSiEnMarco('bajar el reporte');
    XLSX.writeFile(libro, nombreArchivo(`Reporte ${c.nombre}${rep.contacto ? ' - ' + rep.contacto : ''}`) + '.xlsx');
    aviso('Reporte descargado (.xlsx)');
  } catch (e) {
    /* sin internet: el mismo contenido en una sola tabla .csv */
    const tar = tarifaCliente(rep.clienteId, rep.hasta);
    const datos = [
      ['ORDEN DE TRABAJO:', c.relacion || 'RELACIÓN ' + c.nombre], [],
      ['CLIENTE:', c.nombre, '', 'Tarifa', 'H. normal', tar.comun],
      ['CONTACTO CLIENTE:', rep.contacto || '', '', '', 'H. extra', tar.extra],
      ['PERÍODO:', fFecha(rep.desde), 'a', fFecha(rep.hasta)], [],
      ['Fecha', 'N°', 'Funcionario', 'Entrada', 'Salida', 'Horas trabajadas', 'Tipo de hora', 'Área', 'Actividad desarrollada', 'P.U.', 'Descuento', 'TOTAL'],
    ];
    let dia = '', n = 0;
    filas.forEach(f => {
      if (f.fecha !== dia){ dia = f.fecha; n = 0; } n++;
      datos.push([n === 1 ? fFecha(f.fecha) : '', n, nombreFunc(f.funcId), f.entrada || '', f.salida || '',
        f.horasCalc, (TIPOS_HORA.find(t => t.id === f.tipoHora) || {}).corto, f.area || '',
        f.obs || f.actividad, f.pu, f.descuento || 0, f.totalCalc]);
    });
    const sub = redondear(sumar(filas, f => f.totalCalc)), iva = redondear(sub * cfg().iva / 100);
    datos.push([], ['', '', '', '', '', '', '', '', '', '', 'SUBTOTAL', sub],
      ['', '', '', '', '', '', '', '', '', '', `IVA ${cfg().iva}%`, iva],
      ['', '', '', '', '', '', '', '', '', '', 'TOTAL', redondear(sub + iva)]);
    exportarCSV(`Reporte ${c.nombre}`, datos);
  }
}
/* Arma una hoja de Excel con el formato de la planilla */
function hojaReporte(c, filas, desde, hasta){
  const tar = tarifaCliente(c.id, hasta);
  const sub = redondear(sumar(filas, f => f.totalCalc));
  const iva = redondear(sub * cfg().iva / 100);
  const e = cfg().empresa;
  const datos = [
    [e.nombre, '', '', '', '', '', '', '', 'ORDEN DE TRABAJO:', c.relacion || ''],
    [e.rubro + ' · RUT ' + e.rut], [],
    ['CLIENTE:', c.nombre, '', '', '', '', '', 'Tarifa'],
    ['CONTACTO CLIENTE:', rep.contacto || (c.contactos || []).map(k => k.nombre).join(' / '), '', '', '', '', '', 'H. normal', tar.comun],
    ['PERÍODO:', fFecha(desde), 'a', fFecha(hasta), '', '', '', 'H. extra', tar.extra], [],
    ['Fecha', 'N°', 'Funcionario', 'Entrada', 'Salida', 'Horas trabajadas', 'Tipo de hora', 'Área', 'Actividad desarrollada', 'P.U.', 'Descuento', 'TOTAL'],
  ];
  let dia = '', n = 0;
  filas.forEach(f => {
    if (f.fecha !== dia){ dia = f.fecha; n = 0; } n++;
    datos.push([n === 1 ? fFecha(f.fecha) : '', n, nombreFunc(f.funcId), f.entrada || '', f.salida || '',
      f.horasCalc, (TIPOS_HORA.find(t => t.id === f.tipoHora) || {}).corto, f.area || '',
      f.obs || f.actividad, f.pu, f.descuento || 0, f.totalCalc]);
  });
  datos.push(['', '', '', '', 'TOTAL HORAS', redondear(sumar(filas, f => f.horasCalc))]);
  datos.push([], ['', '', '', '', '', '', '', '', '', '', 'SUBTOTAL', sub]);
  datos.push(['', '', '', '', '', '', '', '', '', '', `IVA ${cfg().iva}%`, iva]);
  datos.push(['', '', '', '', '', '', '', '', '', '', 'TOTAL', redondear(sub + iva)]);
  /* cuadro por centro de costo */
  const cc = {};
  filas.forEach(f => { const k = f.area || 'Sin área'; cc[k] = redondear((cc[k] || 0) + f.totalCalc); });
  datos.push([], ['ÍTEM', 'Centro de Costo', '%', 'TOTAL POR C/C']);
  Object.entries(cc).sort((a, b) => b[1] - a[1]).forEach(([k, v], i) =>
    datos.push([i + 1, k, sub ? Math.round(v / sub * 100) / 100 : 0, v]));
  datos.push(['', 'TOTAL', 1, sumar(Object.values(cc))]);

  const hoja = XLSX.utils.aoa_to_sheet(datos);
  hoja['!cols'] = [{ wch: 12 }, { wch: 5 }, { wch: 20 }, { wch: 9 }, { wch: 9 }, { wch: 10 },
    { wch: 12 }, { wch: 22 }, { wch: 46 }, { wch: 10 }, { wch: 10 }, { wch: 13 }];
  return hoja;
}
async function repExcelTareas(){

  const g = {};
  partes.forEach(p => { const k = p.actividad || 'Sin descripción'; (g[k] = g[k] || []).push(p); });
  exportarExcel('Trabajos y tareas', [

async function repExcelHoras(){
  const filas = filasEntre(rep.desde, rep.hasta, f => f.clienteId === rep.clienteId && rep.incluir.includes(f.estado));
  if (!filas.length) return aviso('No hay nada para exportar', { tipo: 'error' });
  const g = {};
  filas.forEach(f => { (g[f.funcId] = g[f.funcId] || []).push(f); });
  exportarExcel('Horas por funcionario', [
    { t: 'Funcionario', v: x => nombreFunc(x.id) },

    { t: 'Horas comunes', v: x => sumar(x.l.filter(f => f.tipoHora === 'comun'), f => f.horasCalc) },

let _logoPNG = null;
/* Pasa el logo (que es un dibujo SVG) a una imagen, que es lo que entiende el PDF */
function logoPNG(){
  if (_logoPNG) return Promise.resolve(_logoPNG);
  return new Promise(ok => {
    const sprite = document.querySelector('#ihisa-marca');
    if (!sprite) return ok(null);
    const vb = sprite.getAttribute('viewBox') || '0 30 1000 960';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="600" height="576">
      <g fill="#1D1B42" color="#1D1B42">${sprite.innerHTML.replace(/currentColor/g, '#1D1B42')}</g></svg>`;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = 600; cv.height = 576;
      const cx = cv.getContext('2d');
      cx.drawImage(img, 0, 0, 600, 576);
      _logoPNG = cv.toDataURL('image/png');
      ok(_logoPNG);
    };
    img.onerror = () => ok(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function repPDF(){
  const filas = rep.tipo === 'cliente' ? repFilas() : null;
  if (rep.tipo === 'cliente' && !filas.length) return aviso('No hay nada para exportar con estos filtros', { tipo: 'error' });
  try {
    await cargarScript(CDN.jspdf);
    await cargarScript(CDN.autotable);
  } catch (e) {
    aviso('Sin internet no puedo armar el PDF: te abro la ventana de impresión (ahí elegís «Guardar como PDF»)', { tipo: 'alerta', ms: 6000 });
    return setTimeout(repImprimir, 900);
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: rep.tipo === 'cliente' ? 'landscape' : 'landscape', unit: 'mm', format: 'a4' });
  const logo = await logoPNG();
  const c = clienteDe(rep.clienteId), e = cfg().empresa;
  const W = doc.internal.pageSize.getWidth();

  /* --- Encabezado --- */
  if (logo) doc.addImage(logo, 'PNG', 12, 8, 26, 25);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(120);
  doc.text('ORDEN DE TRABAJO:', 44, 14);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(29, 27, 66);
  const titulo = rep.tipo === 'cliente' ? (c.relacion || 'RELACIÓN ' + (c.nombre || '').toUpperCase())
    : (rep.tipo === 'tareas' ? 'REPORTE DE TRABAJOS Y TAREAS' : 'REPORTE DE HORAS POR FUNCIONARIO');
  doc.text(titulo, 44, 21);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(90);
  doc.text(`${e.nombre} · ${e.rubro} · RUT ${e.rut} · ${e.telefono}`, 44, 27);
  doc.text([`CLIENTE: ${c.nombre}`,
            `CONTACTO: ${rep.contacto || (c.contactos || []).map(k => k.nombre).join(' / ') || '—'}`,
            `PERÍODO: ${fFecha(rep.desde)} al ${fFecha(rep.hasta)}`], W - 12, 14, { align: 'right' });

  /* --- Tabla --- */
  const estilo = {
    startY: 36, theme: 'grid', margin: { left: 12, right: 12 },
    styles: { fontSize: 7.4, cellPadding: 1.4, lineColor: [205, 210, 220], lineWidth: .15, textColor: [25, 28, 45] },
    headStyles: { fillColor: [29, 27, 66], textColor: 255, fontSize: 7.2, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [246, 247, 250] },
    footStyles: { fillColor: [235, 238, 244], textColor: [29, 27, 66], fontStyle: 'bold' },
  };
  if (rep.tipo === 'cliente'){
    const tar = tarifaCliente(rep.clienteId, rep.hasta);
    const sub = redondear(sumar(filas, f => f.totalCalc)), iva = redondear(sub * cfg().iva / 100);
    doc.setFontSize(7.5); doc.setTextColor(90);
    doc.text(`Tarifa: hora normal ${pesos(tar.comun)} · hora extra ${pesos(tar.extra)}`, 12, 33);
    let dia = '', n = 0;
    const cuerpo = filas.map(f => {
      if (f.fecha !== dia){ dia = f.fecha; n = 0; } n++;
      return [n === 1 ? fFecha(f.fecha) : '', n, nombreFunc(f.funcId), f.entrada || '', f.salida || '',
        fHorasN(f.horasCalc), (TIPOS_HORA.find(t => t.id === f.tipoHora) || {}).corto, f.area || '',
        (f.obs || f.actividad) + (f.ot ? ' · ' + f.ot : ''), pesos(f.pu), f.descuento ? pesos(f.descuento) : '', pesos(f.totalCalc)];
    });
    doc.autoTable({ ...estilo,
      head: [['Fecha', 'N°', 'Funcionario', 'Entr.', 'Sal.', 'Horas', 'Tipo', 'Área', 'Actividad desarrollada', 'P.U.', 'Desc.', 'TOTAL']],
      body: cuerpo,
      foot: [['', '', '', '', '', fHorasN(sumar(filas, f => f.horasCalc)), '', '', '', '', 'SUBTOTAL', pesos(sub)],
             ['', '', '', '', '', '', '', '', '', '', `IVA ${cfg().iva}%`, pesos(iva)],
             ['', '', '', '', '', '', '', '', '', '', 'TOTAL', pesos(redondear(sub + iva))]],
      columnStyles: { 1: { halign: 'center', cellWidth: 8 }, 3: { halign: 'center' }, 4: { halign: 'center' },
        5: { halign: 'right' }, 6: { halign: 'center' }, 9: { halign: 'right' }, 10: { halign: 'right' }, 11: { halign: 'right' } },
    });
    /* cuadro por centro de costo */
    const cc = {};
    filas.forEach(f => { const k = f.area || 'Sin área'; cc[k] = redondear((cc[k] || 0) + f.totalCalc); });
    const lista = Object.entries(cc).sort((a, b) => b[1] - a[1]);
    doc.autoTable({ ...estilo, startY: doc.lastAutoTable.finalY + 8, tableWidth: 120,
      head: [['ÍTEM', 'Centro de Costo', '%', 'TOTAL POR C/C']],
      body: lista.map(([k, v], i) => [i + 1, k, (sub ? Math.round(v / sub * 100) : 0) + '%', pesos(v)]),
      foot: [['', 'TOTAL', '100%', pesos(sumar(lista, x => x[1]))]],
      columnStyles: { 0: { halign: 'center', cellWidth: 12 }, 2: { halign: 'right' }, 3: { halign: 'right' } } });
    const y = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(7.5); doc.setTextColor(60);
    doc.text(`Total: ${enLetras(redondear(sub + iva))} pesos uruguayos.`, 12, y);
    doc.setDrawColor(150);
    doc.line(W - 150, y + 18, W - 85, y + 18); doc.line(W - 72, y + 18, W - 12, y + 18);
    doc.setFontSize(7); doc.setTextColor(110);
    doc.text('Por IHISA Metalúrgica', W - 150, y + 22);
    doc.text('Por ' + c.nombre, W - 72, y + 22);
  } else if (rep.tipo === 'tareas'){
    const partes = repPartes();
    const g = {};
    partes.forEach(p => { const k = p.actividad || 'Sin descripción'; (g[k] = g[k] || []).push(p); });
    const l = Object.entries(g).map(([k, ps]) => ({ k, ps, t: totalesDe(ps) })).sort((a, b) => b.t.horas - a.t.horas);
    doc.autoTable({ ...estilo,
      head: [['Tarea / actividad', 'Tipo', 'Fechas', 'Quiénes trabajaron', 'Horas', 'Subtotal']],
      body: l.map(x => {
        const f = [...new Set(x.ps.map(p => p.fecha))].sort();
        const pf = {}; x.ps.forEach(p => (p.filas || []).forEach(z => pf[z.funcId] = redondear((pf[z.funcId] || 0) + horasFila(z))));
        return [x.k, nombreTipo(x.ps[0].tipoId),
          f.length === 1 ? fFecha(f[0]) : `${fCorta(f[0])} al ${fCorta(f[f.length - 1])} (${f.length} días)`,
          Object.entries(pf).sort((a, b) => b[1] - a[1]).map(([id, h]) => `${nombreCorto(nombreFunc(id))} ${fHorasN(h)}`).join(', '),
          fHorasN(x.t.horas), pesos(x.t.subtotal)];
      }),
      foot: [[`${l.length} tarea(s)`, '', '', '', fHorasN(sumar(l, x => x.t.horas)), pesos(sumar(l, x => x.t.subtotal))]],
      columnStyles: { 4: { halign: 'right' }, 5: { halign: 'right' } } });
  } else {
    const fl = filasEntre(rep.desde, rep.hasta, f => f.clienteId === rep.clienteId && rep.incluir.includes(f.estado));
    const g = {};
    fl.forEach(f => { (g[f.funcId] = g[f.funcId] || []).push(f); });
    const l = Object.entries(g).map(([id, ls]) => ({ id, ls })).sort((a, b) => sumar(b.ls, f => f.horasCalc) - sumar(a.ls, f => f.horasCalc));
    doc.autoTable({ ...estilo,
      head: [['Funcionario', 'Especialidad', 'Comunes', 'Extra', 'Descanso', 'Total', 'Días', 'Facturado']],
      body: l.map(x => [nombreFunc(x.id), (funcDe(x.id) || {}).especialidad || '',
        fHorasN(sumar(x.ls.filter(f => f.tipoHora === 'comun'), f => f.horasCalc)),
        fHorasN(sumar(x.ls.filter(f => f.tipoHora === 'extra'), f => f.horasCalc)),
        fHorasN(sumar(x.ls.filter(f => f.tipoHora === 'descanso'), f => f.horasCalc)),
        fHorasN(sumar(x.ls, f => f.horasCalc)), new Set(x.ls.map(f => f.fecha)).size,
        pesos(sumar(x.ls, f => f.totalCalc))]),
      foot: [[`${l.length} funcionario(s)`, '', '', '', '', fHorasN(sumar(fl, f => f.horasCalc)), '', pesos(sumar(fl, f => f.totalCalc))]],
      columnStyles: { 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'center' }, 7: { halign: 'right' } } });
  }

  /* --- Numeración de páginas --- */
  const n = doc.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++){
    doc.setPage(i);
    doc.setFontSize(6.8); doc.setTextColor(140);
    doc.text(`${e.nombre} · emitido el ${fFecha(hoy())}`, 12, doc.internal.pageSize.getHeight() - 6);
    doc.text(`Página ${i} de ${n}`, W - 12, doc.internal.pageSize.getHeight() - 6, { align: 'right' });
  }
  avisarSiEnMarco('bajar el PDF');
  doc.save(nombreArchivo(`Reporte ${c.nombre}${rep.contacto ? ' - ' + rep.contacto : ''}`) + '.pdf');
  aviso('PDF descargado');
}

function bajarRespaldo(){
  bajar(new Blob([JSON.stringify(D(), null, 1)], { type: 'application/json' }), nombreArchivo('Respaldo') + '.json');
  aviso('Respaldo descargado');
}
function subirRespaldo(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const lector = new FileReader();
  lector.onload = async () => {
    try {
      const d = JSON.parse(lector.result);
      if (!d || !Array.isArray(d.partes)) throw new Error('formato');
      if (!await confirmar({ titulo: '¿Restaurar este respaldo?',
        texto: `Tiene <b>${d.partes.length} parte(s)</b> y <b>${(d.funcionarios || []).length} funcionario(s)</b>.
          Lo que está cargado ahora se reemplaza.`, si: 'Restaurar', peligro: true })) return;
      Store.data = d; Store.guardar(); Store.cargar();
      pintarVista(); aviso('Respaldo restaurado');
    } catch (e) { aviso('Ese archivo no es un respaldo de esta página', { tipo: 'error' }); }
    inp.value = '';
  };
  lector.readAsText(f);
}
async function volverEjemplo(){
  if (!await confirmar({ titulo: '¿Volver a los datos de ejemplo?',
    texto: 'Se borra todo lo que cargaste en este navegador y la demostración vuelve a como estaba al principio.',
    si: 'Sí, volver al ejemplo', peligro: true })) return;
  Store.reiniciar(); irA('panel'); aviso('Datos de ejemplo cargados de nuevo');
}


/* ===== js/19-celular.js ===== */
/* =====================================================================
   CELULAR: las tablas anchas
   En el celular una tabla de 10 columnas no entra. En vez de achicar la
   letra hasta que no se lea, la tabla se desliza de costado con la
   PRIMERA COLUMNA FIJA (así siempre se sabe de qué fila es cada número)
   y se avisa con un cartelito la primera vez que aparece.

   No hay que tocar nada al agregar una sección: esto se fija solo, después
   de cada dibujado, en todas las tablas que no entran en la pantalla.
   ===================================================================== */
function acomodarTablas(){
  if (!esCelular()) return;
  $$('.tabla-resp').forEach(caja => {
    const ancha = caja.scrollWidth > caja.clientWidth + 4;
    caja.classList.toggle('se-desliza', ancha);
    const tabla = caja.querySelector('table');
    if (tabla) tabla.classList.toggle('col1-fija', ancha);
    /* el aviso, una sola vez por tabla */
    let aviso = caja.previousElementSibling;
    const esAviso = aviso && aviso.classList && aviso.classList.contains('aviso-desliza');
    if (ancha && !esAviso){
      const el = document.createElement('div');
      el.className = 'aviso-desliza';
      el.innerHTML = `${ico('der')} Deslizá la tabla de costado para ver el resto`;
      caja.parentNode.insertBefore(el, caja);
    } else if (!ancha && esAviso){ aviso.remove(); }
  });
}
/* Se llama solo después de dibujar cada sección y cada ventana (ver pintarVista) */
function alPintar(){ acomodarTablas(); }
window.addEventListener('resize', () => { if (Store.usuario) acomodarTablas(); });
